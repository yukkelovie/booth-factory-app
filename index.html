<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3Dアセット工場</title>
<meta name="theme-color" content="#e5b100">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="3Dアセット工場">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<!-- 3Dビューア用。three.js は「3Dで回して見る」を押したときに初めて読み込む -->
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }</script>
<style>
/* レイアウト：上にヘッダー、下にタブバー（確認／ライン／ログ／設定）。中身は1カラムの縦スクロール */
:root {
  --bg: #ecebe7;        /* コンクリート */
  --surface: #f8f7f4;
  --ink: #1f2326;       /* アスファルト */
  --muted: #676b6e;
  --line: #d3d1cb;
  --mark: #e5b100;      /* 道路標示の黄 */
  --mark-ink: #1f2326;
  --ok: #2f7a4a;
  --warn: #b5481d;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --tabbar: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17191b; --surface: #212427; --ink: #e9e7e2; --muted: #9a9ea1; --line: #34383b;
  --mark: #f0c21a; --mark-ink: #17191b; --ok: #6cc28c; --warn: #f08a5d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17191b; --surface: #212427; --ink: #e9e7e2; --muted: #9a9ea1; --line: #34383b;
  --mark: #f0c21a; --mark-ink: #17191b; --ok: #6cc28c; --warn: #f08a5d; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.65;
  -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }

.top { position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line); }
.top-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.top h1 { margin: 0; font-size: 20px; font-weight: 900; line-height: 1.2; flex: 1; min-width: 0; }
.stripe { display: inline-block; width: 16px; height: 16px; margin-right: 8px; vertical-align: -1px;
  background: repeating-linear-gradient(-45deg, var(--mark) 0 4px, var(--ink) 4px 8px); border-radius: 3px; }
.when { margin: 2px 0 0; font-size: 12px; color: var(--muted); font-weight: 400; }
.reload { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-width: 44px; min-height: 44px;
  cursor: pointer; font-size: 18px; }
.reload.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

main { max-width: 720px; margin: 0 auto;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 32px) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 22px; }
h2 { font-size: 18px; font-weight: 900; margin: 6px 0 -10px; }
h2 small { font-family: var(--f-data); font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 6px; }
h4 { font-size: 13px; margin: 6px 0 0; color: var(--muted); letter-spacing: .04em; }
ul { margin: 0; padding-left: 1.2em; } li { margin: 2px 0; }
code { font-family: var(--f-data); font-size: .88em; }
.muted { color: var(--muted); margin: 0; }
.hint { font-size: 12px; margin-top: -6px; }
.banner { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--mark); color: var(--mark-ink); font-weight: 700; }
.banner.err { background: transparent; color: var(--warn); border: 1px solid var(--warn); }

/* タブバー */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { border: 0; background: transparent; min-height: var(--tabbar); display: grid; place-items: center; gap: 0; padding: 6px 0;
  cursor: pointer; color: var(--muted); position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab span { font-size: 11px; line-height: 1.2; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 700; }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; background: var(--mark); border-radius: 0 0 3px 3px; }
.badge { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
  background: var(--warn); color: #fff; font-family: var(--f-data); font-size: 11px; line-height: 18px; text-align: center; }
.tab:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }

/* ラインの状況 */
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); gap: 6px; }
.flow li { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0; text-align: center; display: grid; }
.flow-btn { border: 0; background: transparent; color: inherit; font: inherit; padding: 8px 4px; display: grid; gap: 2px; cursor: pointer; border-radius: 8px; min-height: 44px; }
.flow-btn::after { content: "›"; font-size: 11px; color: var(--muted); line-height: 1; }
.open-item { border: 0; background: transparent; color: inherit; font: inherit; padding: 0; text-align: left; display: grid; gap: 4px; cursor: pointer; width: 100%; }
.card { scroll-margin-top: 90px; }
.stage-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stage-head h2 { margin: 0; flex: 1; min-width: 0; }
.flow b { font-family: var(--f-data); font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.flow span { font-size: 11px; color: var(--muted); }
.flow li.hot { background: var(--mark); border-color: var(--mark); }
.flow li.hot b, .flow li.hot span { color: var(--mark-ink); }

/* カード */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.card h3 { margin: 0; font-size: 20px; font-weight: 900; line-height: 1.3; }
.code { margin: 0; font-family: var(--f-data); font-size: 12px; color: var(--muted); }
.dims { margin: 0; font-family: var(--f-data); font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dims span, .dims small { color: var(--muted); }
.pic { width: 100%; border-radius: 8px; border: 1px solid var(--line); background: var(--line); min-height: 120px; object-fit: contain; }
.pic.loading { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
.legend { margin: -4px 0 0; font-size: 11px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-data); font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); font-weight: 700; } .chip.plain { color: var(--muted); }
.btn.v3d-open { width: 100%; min-height: 44px; }
.path { display: flex; align-items: center; gap: 8px; }
.path code { flex: 1; min-width: 0; font-family: var(--f-data); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; line-height: 1.4; }
.path .btn { flex: none; padding: 6px 12px; min-height: 36px; font-weight: 400; }
/* 3Dビューア：全画面。上に名前と閉じる、真ん中にキャンバス、下に操作 */
.v3d { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
.v3d-head { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top, 0px) + 8px) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.v3d-head h3 { margin: 0; font-size: 16px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v3d-stage { flex: 1; position: relative; min-height: 0; touch-action: none; }
.v3d-stage canvas { display: block; width: 100%; height: 100%; }
.v3d-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center;
  font-size: 14px; color: var(--muted); pointer-events: none; }
.v3d-hint { position: absolute; left: 0; right: 0; top: 8px; margin: 0; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; }
.v3d-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 8px) max(16px, env(safe-area-inset-left, 0px)); }
.v3d-foot .btn { padding: 8px 14px; min-height: 40px; }
.v3d-foot .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.v3d-foot small { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); }
details.sub { border-top: 1px solid var(--line); padding-top: 8px; }
details.sub summary { cursor: pointer; font-size: 13px; color: var(--muted); min-height: 32px; }
details.sub .pic { margin-top: 8px; }
details.sub pre { white-space: pre-wrap; font-size: 12px; margin: 8px 0 0; font-family: var(--f-body); }
.meta { margin: 0; font-size: 11px; color: var(--muted); font-family: var(--f-data); }

/* 返事 */
.decide { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.btns.one { grid-template-columns: 1fr; } .btns.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.decide button, .btn { font-weight: 700; padding: 10px 6px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); cursor: pointer; min-height: 44px; }
.decide button:disabled, .btn:disabled { opacity: .45; cursor: default; }
.act-ok, .act-prep_ok { background: var(--ok) !important; border-color: var(--ok) !important; color: var(--surface); }
.act-fix, .act-prep_fix, .act-prep, .btn.primary { background: var(--mark) !important; border-color: var(--mark) !important; color: var(--mark-ink); }
.act-reject { color: var(--warn); border-color: var(--warn) !important; background: transparent !important; }
.fixbox { display: grid; gap: 6px; }
.fixbox label { font-size: 13px; color: var(--muted); }
textarea, input[type="text"], input[type="password"] { font-size: 16px; width: 100%; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); resize: vertical; }
.photo-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.photo-row .btn { font-weight: 400; min-height: 40px; padding: 6px 14px; }
.thumbs { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs:empty { display: none; }
.thumbs li { margin: 0; position: relative; width: 72px; height: 72px; }
.thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--line); }
.thumbs .rm { position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; min-height: 0; padding: 0; border-radius: 999px;
  font-size: 14px; line-height: 1; background: var(--ink); color: var(--surface); border: 2px solid var(--surface); }
.sent { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; background: var(--bg); }
.sent p { margin: 0; font-weight: 700; min-width: 0; }
.sent .btn { background: transparent; min-height: 36px; padding: 6px 12px; font-weight: 400; }
.state { margin: 0; font-size: 12px; color: var(--muted); }
.state:empty { display: none; }

/* 棚（サムネ一覧） */
.shelf { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.shelf > li { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 4px; min-width: 0; align-content: start; }
.shelf .pic { aspect-ratio: 1; min-height: 0; object-fit: cover; border-radius: 6px; }
.s-name { margin: 0; font-weight: 700; font-size: 14px; line-height: 1.3; }
.s-meta { margin: 0; font-family: var(--f-data); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.shelf .decide { padding-top: 8px; gap: 6px; }
.shelf .decide button { font-size: 13px; }

.queue { list-style: none; margin: 0; padding: 0; }
.queue li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); margin: 0; }
.queue li:first-child span::before { content: "次 "; font-family: var(--f-data); font-size: 11px; background: var(--mark); color: var(--mark-ink); padding: 1px 6px; border-radius: 4px; margin-right: 6px; }
.queue code { color: var(--muted); font-size: 12px; }
.logs { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.logs > li { margin: 0; }
.log-h { margin: 0; font-family: var(--f-data); font-size: 12px; color: var(--muted); }
.logs ul { font-size: 13px; }
.form { display: grid; gap: 8px; }
.form label { font-size: 13px; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .btn { padding: 10px 16px; }
ol.steps { margin: 0; padding-left: 1.4em; font-size: 14px; }

/* 使い方 */
.help-sec { scroll-margin-top: 90px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.help-sec h3 { margin: 0; font-size: 17px; font-weight: 900; }
.help-sec p { margin: 0; }
.help-toc { display: flex; flex-wrap: wrap; gap: 6px; }
.help-toc a { font-size: 13px; color: var(--ink); text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.fl { display: grid; gap: 0; justify-items: stretch; }
.fl-step { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.fl-step.you { background: var(--mark); border-color: var(--mark); color: var(--mark-ink); }
.fl-step.you small { color: var(--mark-ink); opacity: .8; }
.fl-ico { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--surface); font-size: 18px; }
.fl-step.you .fl-ico { background: var(--surface); color: var(--ink); }
.fl-step b { display: block; line-height: 1.35; }
.fl-step small { display: block; color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 2px; }
.fl-arrow { text-align: center; color: var(--muted); line-height: 1; padding: 4px 0; font-size: 14px; }
.fl-branch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.fl-branch > div { border-radius: 8px; padding: 8px; font-size: 12px; line-height: 1.45; border: 1px solid var(--line); background: var(--bg); min-width: 0; }
.fl-branch b { display: block; font-size: 13px; }
.fl-branch .ok { border-color: var(--ok); } .fl-branch .ok b { color: var(--ok); }
.fl-branch .fix { border-color: var(--mark); } .fl-branch .fix b { color: var(--ink); }
.fl-branch .ng { border-color: var(--warn); } .fl-branch .ng b { color: var(--warn); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { margin: 0; display: grid; grid-template-columns: 54px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.timeline li:last-child { border-bottom: 0; }
.timeline time { font-family: var(--f-data); font-size: 13px; color: var(--muted); }
.anno { position: relative; }
.anno .tag { position: absolute; font-size: 11px; font-weight: 700; background: var(--mark); color: var(--mark-ink); padding: 1px 7px; border-radius: 999px; }
.demo-btns { pointer-events: none; }
dl.faq { margin: 0; display: grid; gap: 12px; }
dl.faq dt { font-weight: 700; }
dl.faq dd { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.stage-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.stage-tbl th, .stage-tbl td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.stage-tbl th { white-space: nowrap; }
.stage-tbl td.you { font-weight: 700; }
@media (max-width: 420px) { .flow b { font-size: 18px; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1><span class="stripe" aria-hidden="true"></span><span id="title">3Dアセット工場</span><p class="when" id="when"></p></h1>
    <button class="reload" id="reload" type="button" aria-label="最新にする">↻</button>
  </div>
</header>

<main id="view-review" data-view="review"></main>
<main id="view-line" data-view="line" hidden></main>
<main id="view-log" data-view="log" hidden></main>
<main id="view-stage" data-view="stage" hidden></main>
<main id="view-help" data-view="help" hidden></main>
<main id="view-settings" data-view="settings" hidden></main>

<nav class="tabs" aria-label="画面の切り替え">
  <div class="tabs-in">
    <button class="tab" type="button" data-tab="review" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
      <span>確認</span><b class="badge" id="badge" hidden></b>
    </button>
    <button class="tab" type="button" data-tab="line">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="6" rx="1"/></svg>
      <span>ライン</span>
    </button>
    <button class="tab" type="button" data-tab="log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span>ログ</span>
    </button>
    <button class="tab" type="button" data-tab="help">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M10 8.5a2 2 0 1 1 2.5 1.9c-.4.2-.5.5-.5.9V12M12 14.5h.01"/></svg>
      <span>使い方</span>
    </button>
    <button class="tab" type="button" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>設定</span>
    </button>
  </div>
</nav>

<script>
(() => {
  // ---------------------------------------------------------------- 設定・GitHub API
  // データは非公開リポジトリ（data.json と img/）、返事は同じリポジトリの inbox/ にファイルで置く。PCの見張りが5分おきに読んで振り分ける
  const DEFAULT_REPO = "yukkelovie/booth-factory";
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} mem[k] = v; },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} delete mem[k]; },
  };
  const mem = {};
  const cfg = () => ({ token: store.get("gh_token") || "", repo: store.get("gh_repo") || DEFAULT_REPO });

  class ApiError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
  async function api(path, { method = "GET", body, raw = false } = {}) {
    const { token, repo } = cfg();
    if (!token) throw new ApiError(0, "no_token");
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
      method, cache: "no-store",
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        ...(body ? { "Content-Type": "application/json" } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) {
      const limited = r.status === 429 || (r.status === 403 && r.headers.get("x-ratelimit-remaining") === "0");
      throw new ApiError(limited ? 429 : r.status === 403 && method !== "GET" ? 4031 : r.status, `${r.status}`);
    }
    return r;
  }
  const b64utf8 = s => { const u = new TextEncoder().encode(s); let b = ""; for (const c of u) b += String.fromCharCode(c); return btoa(b); };
  const blobB64 = blob => new Promise((ok, ng) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(",")[1]); fr.onerror = ng; fr.readAsDataURL(blob); });
  const errText = e => e.message === "no_token" ? "設定タブで鍵（トークン）を入れてください"
    : e.status === 401 ? "鍵（トークン）が無効です。設定タブで入れ直してください"
    : e.status === 4031 ? "鍵に書き込みの権限がありません。GitHub でこの鍵を Edit して、Contents を「Read and write」にしてください"
    : e.status === 403 ? "鍵に booth-factory を読む権限がありません。鍵の Repository access を確認してください"
    : e.status === 429 ? "GitHub の回数制限です。少し待ってからもう一度押してください"
    : e.status === 404 ? "リポジトリが見つかりません（鍵の対象リポジトリを確認）"
    : e.status === 409 || e.status === 422 ? "他の送信とぶつかりました。もう一度押してください"
    : "通信できませんでした（" + (e.status || "オフライン") + "）";

  // 画像・3Dは非公開なので、鍵付きで取ってきて blob URL にする
  const imgCache = new Map();
  function blobUrl(path) {
    if (!imgCache.has(path)) {
      const p = api(path, { raw: true }).then(r => r.blob()).then(b => URL.createObjectURL(b));
      p.catch(() => imgCache.delete(path));
      imgCache.set(path, p);
    }
    return imgCache.get(path);
  }
  function loadImg(el) {
    const path = el.dataset.src;
    if (!path) return;
    blobUrl(path).then(u => { el.src = u; el.classList.remove("loading"); })
      .catch(() => { el.classList.remove("loading"); el.alt = "画像を読めませんでした"; });
  }
  const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { io.unobserve(e.target); loadImg(e.target); }
  }), { rootMargin: "400px" }) : null;
  const hydrateImgs = root => root.querySelectorAll("img[data-src]").forEach(el => io ? io.observe(el) : loadImg(el));

  // ---------------------------------------------------------------- 描画
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>");
  const fmt = iso => { if (!iso) return ""; const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; };
  const pic = (path, alt, cls = "pic") => path ? `<img class="${cls} loading" data-src="${esc(path)}" alt="${esc(alt)}">` : "";
  const list = (title, xs) => xs && xs.length ? `<h4>${title}</h4><ul>${xs.map(x => `<li>${md(x)}</li>`).join("")}</ul>` : "";
  const short = it => it.name.split("／")[0];

  const LABEL = { ok: "OK", fix: "直して", reject: "ボツ", prep: "整えた", prep_ok: "工程C確定", prep_fix: "工程Cの直し" };
  const MODES = {
    review: { acts: ["ok", "fix", "reject"], cls: "", note: { fix: ["直してほしいこと", "例：支柱をもう少し太く。屋根はフラットに"] } },
    prep: { acts: ["prep"], cls: "one", note: { prep: ["工程Cへのメモ（なくてもOK）", "例：扉はギミックにしたい／UVはそのまま"] } },
    prep_review: { acts: ["prep_ok", "prep_fix"], cls: "two", note: { prep_fix: ["工程Cへの直し", "例：取っ手の面は消さないで／ガラスは別のテクスチャセットに"] } },
  };
  const BTN_TEXT = { ok: "OK", fix: "直して", reject: "ボツ", prep: "整えた → 工程Cへ", prep_ok: "OK（確定）", prep_fix: "直して" };
  const NOTE_REQUIRED = ["fix", "prep_fix"];

  function decideUI(it, mode) {
    const m = MODES[mode];
    return `<div class="decide" data-item="${esc(it.id)}" data-mode="${mode}">
      <div class="btns ${m.cls}">${m.acts.map(a => `<button type="button" class="act-${a}" data-act="${a}">${BTN_TEXT[a]}</button>`).join("")}</div>
      <div class="fixbox" hidden>
        <label></label>
        <textarea rows="3"></textarea>
        <div class="photo-row">
          <input type="file" accept="image/*" multiple hidden>
          <button type="button" class="btn add-photo">写真を追加</button>
          <span class="muted" style="font-size:12px">参考写真・スクショ（4枚まで）</span>
        </div>
        <ul class="thumbs"></ul>
        <button type="button" class="btn primary send">送る</button>
      </div>
      <div class="sent" hidden><p></p><div class="row"><button type="button" class="btn primary now" hidden></button><button type="button" class="btn undo">取り消す</button></div></div>
      <p class="state" aria-live="polite"></p>
    </div>`;
  }

  function card(it, mode) {
    const d = it.dims || [0, 0, 0];
    const fb = it.feedback ? `<details class="sub"><summary>feedback.md</summary><pre>${esc(it.feedback)}</pre></details>` : "";
    return `<article class="card" id="item-${esc(it.id)}">
      <header class="card-head"><div><h3>${esc(it.name)}</h3><p class="code">${esc(it.id)}</p></div>
        <p class="dims">${d[0].toFixed(2)}<span>×</span>${d[1].toFixed(2)}<span>×</span>${d[2].toFixed(2)}<small> m</small></p></header>
      ${it.img.sheet ? pic(it.img.sheet, it.id + " の4面図（正面・左側面・上面・パース）") + '<p class="legend">左上 正面 ／ 右上 左側面 ／ 左下 上面 ／ 右下 パース</p>' : '<p class="muted">画像なし</p>'}
      <div class="chips">
        <span class="chip ${it.tris <= it.budget ? "ok" : "warn"}">ポリ ${it.tris.toLocaleString()} / ${it.budget.toLocaleString()}</span>
        <span class="chip ${it.floating ? "warn" : "ok"}">${it.floating ? "浮き " + it.floating : "浮きなし"}</span>
        <span class="chip plain">マテリアル ${esc(it.materials ?? "—")}</span>
      </div>
      ${v3dBtn(it)}
      ${list("見てほしい点", it.look)}
      ${list("工程Bで直したこと", it.fixed)}
      ${mode ? decideUI(it, mode) : ""}
      ${it.img.uv || it.img.uv_layout ? `<details class="sub"><summary>UV（展開図・チェッカー）</summary>
        ${it.img.uv_layout ? `<h4>展開図</h4>${pic(it.img.uv_layout, "UV展開図")}` : ""}
        ${it.img.uv ? `<h4>チェッカー（市松模様がゆがんでいなければOK）</h4>${pic(it.img.uv, "UVチェッカー")}` : ""}
      </details>` : ""}
      ${it.prep ? uvSets(it) : ""}
      ${fb}
      ${pathRow(it)}
      <p class="meta">ビルド ${esc(it.built)}</p>
    </article>`;
  }

  // PCで開くファイルの場所（PCのブラウザなら「コピー」してエクスプローラーや Blender の「開く」に貼れる）
  const pathRow = it => it.path ? `<div class="path"><code>${esc(it.path)}</code><button type="button" class="btn copy-path" data-path="${esc(it.path)}">コピー</button></div>` : "";
  const v3dBtn = (it, sub = "") => it.glb ? `<button type="button" class="btn v3d-open" data-v3d="${esc(it.id)}">3Dで回して見る${sub}</button>` : "";

  // 工程Cのテクスチャセットごとの UV 展開図（Print で始まるセットは写真・ラベル用）
  function uvSets(it) {
    const s = Object.entries((it.img && it.img.uv_sets) || {}).filter(([, path]) => path);
    if (!s.length) return "";
    return `<details class="sub"><summary>UV展開図（テクスチャセットごと・${s.length}枚）</summary>
      ${s.map(([name, path]) => `<h4>${esc(name)}${/^print/i.test(name) ? "（写真・ラベル用。上向きのまま）" : ""}</h4>${pic(path, name + " のUV展開図")}`).join("")}
    </details>`;
  }

  function prepCard(it) {
    const p = it.prep || {};
    return `<article class="card" id="item-${esc(it.id)}">
      <header class="card-head"><div><h3>${esc(short(it))}</h3><p class="code">${esc(it.id)} ・ 工程Cの仮の結果</p></div></header>
      ${it.img.hidden ? `<h4>消す面（赤）</h4>${pic(it.img.hidden, "削除面プレビュー")}<p class="legend">赤＝消す（部品に完全に埋まった面）／オレンジ＝一部隠れ（残す）／半透明＝残す</p>` : ""}
      <div class="chips">
        <span class="chip warn">消す ${p.removed ?? 0} 面</span>
        <span class="chip plain">low ${(p.low_tris || 0).toLocaleString()} tris</span>
        <span class="chip plain">high ${(p.high_tris || 0).toLocaleString()} tris</span>
        <span class="chip plain">ギミック ${esc((p.gimmicks || []).join("、") || "なし")}</span>
      </div>
      ${v3dBtn(it, "（整えた .blend）")}
      ${it.img.sets ? `<h4>パーツ分け・テクスチャセット（色＝セット）</h4>${pic(it.img.sets, "テクスチャセット色分け")}` : ""}
      ${(p.objects || []).length ? `<h4>オブジェクト</h4><ul>${p.objects.map(o => `<li><code>${esc(o.name)}</code> ${o.tris.toLocaleString()} tris ・ ${esc(o.sets.join(" / "))}</li>`).join("")}</ul>` : ""}
      ${Object.keys(p.sets || {}).length ? `<h4>テクスチャセット</h4><ul>${Object.entries(p.sets).map(([s, os]) => `<li><b>${esc(s)}</b>：${esc(os.join("、"))}</li>`).join("")}</ul>` : ""}
      ${uvSets(it)}
      ${list("確認してほしい点", p.look)}
      ${pathRow(it)}
      ${decideUI(it, "prep_review")}
    </article>`;
  }

  function shelf(its, mode) {
    return `<ul class="shelf">${its.map(it => {
      const d = it.dims || [0, 0, 0];
      const meta = it.prep && it.stage === "60_texturing"
        ? `low ${(it.prep.low_tris || 0).toLocaleString()} ・ high ${(it.prep.high_tris || 0).toLocaleString()} tris ・ ${Object.keys(it.prep.sets || {}).length}セット`
        : `${d[0].toFixed(2)}×${d[1].toFixed(2)}×${d[2].toFixed(2)} m ・ ${it.tris.toLocaleString()} tris`;
      return `<li><button type="button" class="open-item" data-open-stage="${esc(it.stage)}" data-open-item="${esc(it.id)}" aria-label="${esc(short(it))} の詳細を見る">${pic(it.img.persp, it.id + " のパース")}<p class="s-name">${esc(short(it))} ›</p><p class="s-meta">${meta}</p></button>${mode ? decideUI(it, mode) : ""}</li>`;
    }).join("")}</ul>`;
  }

  let data = null, inbox = {}, loadErr = null;
  const byStage = s => data ? data.items.filter(i => i.stage === s) : [];

  function renderReview() {
    const el = document.getElementById("view-review");
    if (!data) { el.innerHTML = noData(); return; }
    const ready = byStage("20_ready"), prep = byStage("55_prep_review"), ok = byStage("40_approved");
    el.innerHTML = `
      ${data.exhausted ? '<p class="banner">テーマのアイデアが尽きました。次のテーマを決めてください。</p>' : ""}
      <h2>確認待ち <small>${ready.length} 点</small></h2>
      ${ready.map(it => card(it, "review")).join("") || '<p class="muted">確認待ちはありません。次は朝7時のラインで届きます。</p>'}
      ${prep.length ? `<h2>工程C確認待ち <small>${prep.length} 点</small></h2><p class="muted hint">消す面とパーツ分けを確認して「OK（確定）」でテクスチャ待ちへ。直す所があれば「直して」</p>${prep.map(prepCard).join("")}` : ""}
      ${ok.length ? `<h2>OK済み <small>${ok.length} 点</small></h2><p class="muted hint">Blenderで整えたら「整えた」を押すと、翌朝の工程Cが仕上げ前処理をします</p>${shelf(ok, "prep")}` : ""}
      <p class="muted" style="font-size:12px">返事はPCが5分以内に各段へ振り分けます（OK → OK済み、直して → 直し待ち、ボツ → ボツ）。作り直しは翌朝7:00のラインか「今すぐ直す」で。</p>`;
    wireDecide(el);
    hydrateImgs(el);
    const n = ready.length + prep.length;
    const b = document.getElementById("badge");
    b.textContent = n; b.hidden = !n;
  }

  function renderLine() {
    const el = document.getElementById("view-line");
    if (!data) { el.innerHTML = noData(); return; }
    const counts = [[data.todo.length, "待ち行列", "todo"], ...data.stages.map(s => [byStage(s.id).length, s.label, s.id])];
    const sections = [["30_feedback", "直し待ち", "翌朝7:00の工程Aが作り直します"], ["10_blockout", "工程A済み", "工程Bの検品待ち"],
      ["50_prep", "工程C待ち", "翌朝7:00の工程Cで、見えない面の削除・パーツ分け・UV・FBX書き出しを仮でやります"],
      ["60_texturing", "テクスチャ待ち", "_prep フォルダの FBX を Substance Painter へ"], ["99_rejected", "ボツ", ""]];
    el.innerHTML = runPanel() + `
      <ol class="flow" aria-label="ラインの状況（押すと一覧へ）">${counts.map(([n, l, id]) => `<li class="${l === "確認待ち" && n ? "hot" : ""}"><button type="button" class="flow-btn" data-open-stage="${id}" aria-label="${l} ${n}件の一覧"><b>${n}</b><span>${l}</span></button></li>`).join("")}</ol>
      ${sections.map(([s, l, h]) => { const its = byStage(s); return its.length ? `<h2>${l} <small>${its.length} 点</small></h2>${h ? `<p class="muted hint">${h}</p>` : ""}${s === "30_feedback" ? its.map(it => card(it)).join("") : shelf(its)}` : ""; }).join("")}
      <h2>次に作るもの <small>${data.todo.length} 件</small></h2>
      <ul class="queue">${data.todo.slice(0, 8).map(t => `<li><span>${esc(t.name)}</span><code>${esc(t.code)}</code></li>`).join("") || "<li><span>待ち行列は空です</span></li>"}</ul>
      ${data.todo.length > 8 ? `<p class="muted">ほか ${data.todo.length - 8} 件</p>` : ""}`;
    wireRun();
    hydrateImgs(el);
  }

  function renderLog() {
    const el = document.getElementById("view-log");
    const sent = Object.values(inbox);
    el.innerHTML = `
      <h2>送った返事 <small>${sent.length} 件</small></h2>
      ${sent.length ? `<ul class="logs">${sent.map(d => `<li><p class="log-h">${fmt(d.at)} ・ 5分以内に振り分け</p><ul><li><b>${esc(d.item)}</b>：${esc(LABEL[d.action] || d.action)}${d.note ? "「" + esc(d.note) + "」" : ""}${(d.photos || []).length ? `（写真${d.photos.length}枚）` : ""}</li></ul></li>`).join("")}</ul>` : '<p class="muted">まだ反映されていない返事はありません。</p>'}
      <h2>工場のログ</h2>
      ${data ? `<ul class="logs">${data.logs.map(l => `<li><p class="log-h">${esc(l.title)}</p><ul>${l.lines.map(x => `<li>${md(x)}</li>`).join("")}</ul></li>`).join("")}</ul>` : noData()}`;
  }

  function renderSettings() {
    const el = document.getElementById("view-settings");
    const c = cfg();
    el.innerHTML = `
      <h2>鍵（GitHub トークン）</h2>
      <p class="muted" style="font-size:13px">工場のデータは非公開リポジトリにあります。読み書きするための鍵をここに入れます。鍵はこの端末の中だけに保存されます。</p>
      <div class="form">
        <label for="tok">トークン（GitHubで作った <code>github_pat_…</code> をコピーして貼り付け）</label>
        <div class="row" style="flex-wrap:nowrap">
          <input type="password" id="tok" autocomplete="off" spellcheck="false" placeholder="github_pat_… を貼り付け" value="${c.token ? "••••••••" : ""}" style="flex:1;min-width:0">
          <button type="button" class="btn" id="peek" aria-pressed="false">表示</button>
        </div>
        <label for="repo">リポジトリ</label>
        <input type="text" id="repo" autocomplete="off" spellcheck="false" value="${esc(c.repo)}">
        <div class="row">
          <button type="button" class="btn primary" id="save">保存して接続</button>
          <button type="button" class="btn" id="forget">鍵を消す</button>
        </div>
        <p class="state" id="set-state" aria-live="polite">${c.token ? "鍵は保存済みです" : "まだ鍵が入っていません"}</p>
      </div>
      <h2>鍵の作り方（一度だけ）</h2>
      <ol class="steps">
        <li>GitHub の Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token</li>
        <li>Repository access：<b>Only select repositories</b> で <code>booth-factory</code> だけを選ぶ</li>
        <li>Permissions → Repository permissions → <b>Contents：Read and write</b></li>
        <li>有効期限は好きな長さで（切れたらまた作って入れ直す）</li>
        <li>できたトークンをコピーして、上に貼って「保存して接続」</li>
      </ol>
      <p class="muted" style="font-size:12px">ホーム画面に追加したアプリと、ブラウザで開いたページは保存場所が別なので、それぞれで一度入れてください。</p>`;
    el.querySelector("#tok").addEventListener("focus", e => { if (e.target.value.startsWith("•")) e.target.value = ""; });
    el.querySelector("#peek").addEventListener("click", e => {
      const tok = el.querySelector("#tok"), show = tok.type === "password";
      tok.type = show ? "text" : "password";
      e.currentTarget.textContent = show ? "隠す" : "表示";
      e.currentTarget.setAttribute("aria-pressed", String(show));
    });
    el.querySelector("#save").addEventListener("click", async () => {
      const t = el.querySelector("#tok").value.trim(), r = el.querySelector("#repo").value.trim() || DEFAULT_REPO;
      const st = el.querySelector("#set-state");
      if (t && !t.startsWith("•") && !/^(github_pat_|ghp_|gho_)\w{20,}$/.test(t)) {
        st.textContent = "これは鍵の文字列ではないようです。トークンの名前ではなく、GitHubで作った直後に出る「github_pat_」で始まる長い文字列を貼ってください";
        return;
      }
      if (t && !t.startsWith("•")) store.set("gh_token", t);
      store.set("gh_repo", r);
      st.textContent = "接続を確かめています…";
      try { await api("data.json", { raw: true }); st.textContent = "つながりました"; imgCache.clear(); await refresh(); }
      catch (e) { st.textContent = errText(e); }
    });

  const noData = () => loadErr ? `<p class="banner err">${esc(loadErr)}</p>` : '<p class="muted">読み込み中…</p>';

  // ---------------------------------------------------------------- 返事（inbox/<Item>.json）
  const MAX_PHOTOS = 4;
  const pending = new Map();   // item -> [{blob, url}]（送る前の写真）

  async function toJpeg(file) {   // スマホ写真（HEIC含む）を長辺2000pxのJPEGに。変換できなければそのまま
    try {
      const bmp = await createImageBitmap(file);
      const s = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      return (await new Promise(r => c.toBlob(r, "image/jpeg", 0.85))) || file;
    } catch (e) { return file; }
  }

  function thumb(src, onRemove) {
    const li = document.createElement("li");
    li.innerHTML = `<img alt="添付写真">`;
    li.querySelector("img").src = src;
    if (onRemove) {
      const rm = document.createElement("button");
      rm.type = "button"; rm.className = "rm"; rm.textContent = "×"; rm.setAttribute("aria-label", "この写真を外す");
      rm.addEventListener("click", onRemove); li.append(rm);
    }
    return li;
  }

  function showState(b) {
    const d = inbox[b.dataset.item];
    const btns = b.querySelector(".btns"), fix = b.querySelector(".fixbox"), sent = b.querySelector(".sent");
    if (d) {
      btns.hidden = true; fix.hidden = true; sent.hidden = false;
      const n = (d.photos || []).length;
      sent.querySelector("p").textContent = "送信済み：" + (LABEL[d.action] || d.action) + (d.note ? "「" + d.note + "」" : "") + (n ? `（写真${n}枚）` : "") + " → 5分以内に振り分け";
      const now = sent.querySelector(".now"), mode = NOW_MODE[d.action];
      now.hidden = !mode;
      if (mode) { now.dataset.mode = mode; paintNow(now); }
    } else { btns.hidden = false; sent.hidden = true; }
  }

  // ---------------------------------------------------------------- 今すぐ動かす（requests/<mode>.json → PCの見張りが5分おきに拾う）
  const NOW_MODE = { fix: "fix", prep: "prep", prep_fix: "prep" };
  const RUN_LABEL = { new: "新作", fix: "直し", prep: "工程C", morning: "朝のライン" };
  let requests = {}, status = null, pollTimer = null, wasActive = false;

  function paintNow(btn) {
    const m = btn.dataset.mode;
    const busy = status && status.state === "running" && status.mode === m;
    btn.disabled = !!requests[m] || busy;
    btn.textContent = busy ? "実行中…" : requests[m] ? "依頼済み" : m === "fix" ? "今すぐ直す" : "今すぐ工程Cへ";
  }

  async function loadRequests() {
    requests = {}; status = null;
    try {
      const files = await (await api("requests")).json();
      files.filter(f => f.type === "file" && /^(new|fix|prep)\.json$/.test(f.name)).forEach(f => { requests[f.name.slice(0, -5)] = { sha: f.sha }; });
    } catch (e) { if (e.status !== 404) throw e; }
    try { status = await (await api("status.json", { raw: true })).json(); } catch (e) { if (e.status !== 404) throw e; }
  }

  async function requestRun(mode) {
    if (requests[mode]) return;
    const body = { message: `今すぐ（${RUN_LABEL[mode]}）`, content: b64utf8(JSON.stringify({ mode, at: new Date().toISOString() })) };
    const r = await (await api(`requests/${mode}.json`, { method: "PUT", body })).json();
    requests[mode] = { sha: r.content.sha };
    paintRun(); startPoll();
  }

  async function cancelRun(mode) {
    const q = requests[mode];
    if (!q) return;
    await api(`requests/${mode}.json`, { method: "DELETE", body: { message: `今すぐの取り消し（${RUN_LABEL[mode]}）`, sha: q.sha } });
    delete requests[mode];
    paintRun();
  }

  function runPanel() {
    if (!data) return "";
    const pend = act => Object.values(inbox).filter(d => act.includes(d.action)).length;
    const n = { new: data.todo.length, fix: byStage("30_feedback").length + pend(["fix"]), prep: byStage("50_prep").length + pend(["prep", "prep_fix"]) };
    const running = status && status.state === "running";
    const line = running ? `<p class="banner">稼働中：${esc(RUN_LABEL[status.mode] || status.mode)}（${fmt(status.since)} から）</p>`
      : Object.keys(requests).length ? `<p class="banner">依頼済み：${Object.keys(requests).map(m => RUN_LABEL[m]).join("・")}。PCが起きていれば5分以内に始まります</p>`
      : `<p class="muted" style="font-size:13px">待機中${status && status.finished ? `（最後の実行 ${fmt(status.finished)}）` : ""}。PCがスリープ中なら、起きたときに始まります</p>`;
    const btn = (m, label, count, unit) => {
      const req = !!requests[m], busy = running && status.mode === m;
      return `<div class="row" style="align-items:center;justify-content:space-between">
        <span style="font-size:14px"><b>${label}</b> <span class="muted" style="font-size:12px">${count}${unit}</span></span>
        ${req && !busy ? `<button type="button" class="btn" data-cancel="${m}">依頼を取り消す</button>`
          : `<button type="button" class="btn primary" data-run="${m}" ${!count || busy ? "disabled" : ""}>${busy ? "実行中…" : "今すぐ"}</button>`}
      </div>`;
    };
    return `<section class="card" id="run-panel" aria-live="polite">
      <h3 style="font-size:17px">今すぐ動かす</h3>
      ${line}
      ${btn("new", "新作を1つ作る", n.new, " 件のアイデア")}
      ${btn("fix", "直しを反映する", n.fix, " 件")}
      ${btn("prep", "工程Cを動かす", n.prep, " 件")}
      <p class="state" id="run-state"></p>
    </section>`;
  }

  function paintRun() {
    const old = document.getElementById("run-panel");
    if (old) { old.outerHTML = runPanel(); wireRun(); }
    document.querySelectorAll(".sent .now:not([hidden])").forEach(paintNow);
  }

  function wireRun() {
    const p = document.getElementById("run-panel");
    if (!p) return;
    const st = t => { const s = document.getElementById("run-state"); if (s) s.textContent = t; };
    p.querySelectorAll("[data-run]").forEach(b => b.addEventListener("click", async () => {
      b.disabled = true; st("依頼中…");
      try { await requestRun(b.dataset.run); } catch (e) { st(errText(e)); b.disabled = false; }
    }));
    p.querySelectorAll("[data-cancel]").forEach(b => b.addEventListener("click", async () => {
      b.disabled = true; st("取り消し中…");
      try { await cancelRun(b.dataset.cancel); } catch (e) { st(e.status === 404 || e.status === 409 ? "もうPCが受け付けたので取り消せません" : errText(e)); await loadRequests().catch(() => {}); paintRun(); }
    }));
  }

  const active = () => Object.keys(requests).length > 0 || (status && status.state === "running");
  function startPoll() {
    wasActive = wasActive || active();
    if (pollTimer || !active()) return;
    pollTimer = setInterval(async () => {
      try { await loadRequests(); } catch (e) { return; }
      if (active()) { paintRun(); return; }
      clearInterval(pollTimer); pollTimer = null;
      const typing = [...document.querySelectorAll(".fixbox:not([hidden]) textarea")].some(t => t.value.trim());
      if (wasActive && !typing) { wasActive = false; refresh(); } else paintRun();
    }, 20000);
  }

  function wireDecide(root) {
    root.querySelectorAll(".decide").forEach(b => {
      const item = b.dataset.item, mode = MODES[b.dataset.mode];
      const setState = t => { b.querySelector(".state").textContent = t; };
      const enable = on => b.querySelectorAll("button").forEach(x => { x.disabled = !on; });
      if (!pending.has(item)) pending.set(item, []);
      const ul = b.querySelector(".fixbox .thumbs"), input = b.querySelector('input[type="file"]');
      const draw = () => ul.replaceChildren(...pending.get(item).map(p => thumb(p.url, () => {
        URL.revokeObjectURL(p.url); pending.set(item, pending.get(item).filter(x => x !== p)); draw();
      })));
      draw();
      showState(b);

      b.querySelectorAll(".btns button").forEach(btn => btn.addEventListener("click", () => {
        const act = btn.dataset.act;
        if (mode.note[act]) {
          b.dataset.pending = act;
          const f = b.querySelector(".fixbox");
          f.querySelector("label").textContent = mode.note[act][0];
          f.querySelector("textarea").placeholder = mode.note[act][1];
          f.hidden = !f.hidden; if (!f.hidden) f.querySelector("textarea").focus();
          return;
        }
        send(act, "");
      }));
      b.querySelector(".add-photo").addEventListener("click", () => input.click());
      input.addEventListener("change", async () => {
        const files = [...input.files].slice(0, MAX_PHOTOS - pending.get(item).length);
        input.value = "";
        for (const f of files) { const blob = await toJpeg(f); pending.get(item).push({ blob, url: URL.createObjectURL(blob) }); }
        draw();
        setState(pending.get(item).length >= MAX_PHOTOS ? "写真は4枚までです" : "");
      });
      b.querySelector(".send").addEventListener("click", () => {
        const act = b.dataset.pending, note = b.querySelector("textarea").value.trim();
        if (NOTE_REQUIRED.includes(act) && !note) { setState("直してほしいことを一言書いてください"); b.querySelector("textarea").focus(); return; }
        send(act, note);
      });
      b.querySelector(".now").addEventListener("click", async e => {
        const btn = e.currentTarget;
        btn.disabled = true; setState("依頼中…");
        try { await requestRun(btn.dataset.mode); setState("PCが起きていれば5分以内に始まります。ラインタブで様子が見られます"); }
        catch (err) { setState(errText(err)); btn.disabled = false; }
      });
      b.querySelector(".undo").addEventListener("click", async () => {
        const d = inbox[item];
        if (!d) return;
        enable(false); setState("取り消し中…");
        try {
          await api(`inbox/${item}.json`, { method: "DELETE", body: { message: `取り消し ${item}`, sha: d._sha } });
          for (const p of d.photos || []) {
            try { const r = await (await api(p)).json(); await api(p, { method: "DELETE", body: { message: `写真の取り消し ${item}`, sha: r.sha } }); } catch (e) {}
          }
          delete inbox[item]; setState(""); showState(b); renderLog(); paintRun();
        } catch (e) { setState(errText(e)); } finally { enable(true); }
      });

      async function send(action, note) {
        enable(false); setState("送信中…");
        try {
          const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15);
          const photos = [];
          if (mode.note[action]) {
            let i = 0;
            for (const p of pending.get(item)) {
              i++; setState(`写真を送信中…（${i}/${pending.get(item).length}）`);
              const path = `inbox/photos/${item}_${stamp}_${i}.jpg`;
              await api(path, { method: "PUT", body: { message: `写真 ${item}`, content: await blobB64(p.blob) } });
              photos.push(path);
            }
          }
          const doc = { item, action, note, photos, at: new Date().toISOString() };
          const body = { message: `${LABEL[action]} ${item}`, content: b64utf8(JSON.stringify(doc, null, 1)) };
          if (inbox[item]) body.sha = inbox[item]._sha;
          const r = await (await api(`inbox/${item}.json`, { method: "PUT", body })).json();
          inbox[item] = { ...doc, _sha: r.content.sha };
          pending.get(item).forEach(p => URL.revokeObjectURL(p.url)); pending.set(item, []);
          draw(); b.querySelector("textarea").value = "";
          setState(""); showState(b); renderLog(); paintRun();
        } catch (e) { setState(errText(e)); }
        finally { enable(true); }
      }
    });
  }

  // ---------------------------------------------------------------- 読み込み
  async function loadInbox() {
    inbox = {};
    let files = [];
    try { files = await (await api("inbox")).json(); } catch (e) { if (e.status !== 404) throw e; }
    await Promise.all(files.filter(f => f.type === "file" && f.name.endsWith(".json")).map(async f => {
      try { const d = await (await api(f.path, { raw: true })).json(); inbox[d.item || f.name.slice(0, -5)] = { ...d, _sha: f.sha }; } catch (e) {}
    }));
  }

  // ---------------------------------------------------------------- 3Dビューア（glb/<Item>.glb、Draco圧縮）
  // 1本指で回転・ピンチでズーム・2本指で移動。光はカメラに付けて、どこから見ても形が読めるようにする
  let threeMods = null, v3d = null;
  const loadThree = () => threeMods || (threeMods = Promise.all([
    import("three"), import("three/addons/controls/OrbitControls.js"),
    import("three/addons/loaders/GLTFLoader.js"), import("three/addons/loaders/DRACOLoader.js"),
  ]).catch(e => { threeMods = null; throw e; }));

  // 四角の線（<Item>.glb.edges.bin、形式は工場の lib/export_glb.py に書いてある）→ LineSegments 用のジオメトリ
  async function loadEdges(THREE, path) {
    const blob = await (await fetch(await blobUrl(path))).blob();
    const ab = await new Response(blob.stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer();
    const dv = new DataView(ab);
    if (dv.getUint32(0) !== 0x45444731) throw new Error("edges: 形式が違う");   // "EDG1"
    const nv = dv.getUint32(4, true), ne = dv.getUint32(8, true);
    const lo = [0, 1, 2].map(i => dv.getFloat32(12 + i * 4, true)), span = [0, 1, 2].map(i => dv.getFloat32(24 + i * 4, true));
    const q = new Uint16Array(ab.slice(36, 36 + nv * 6));
    const d = nv < 65536 ? new Uint16Array(ab.slice(36 + nv * 6, 36 + nv * 6 + ne * 4)) : new Uint32Array(ab.slice(36 + nv * 6, 36 + nv * 6 + ne * 8));
    const pos = new Float32Array(nv * 3);
    for (let i = 0; i < pos.length; i++) pos[i] = lo[i % 3] + q[i] / 65535 * span[i % 3];
    const idx = new Uint32Array(ne * 2);
    for (let e = 0, a = 0; e < ne; e++) { a += d[e * 2]; idx[e * 2] = a; idx[e * 2 + 1] = a + d[e * 2 + 1]; }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    return g;
  }

  async function open3d(it) {
    if (v3d) close3d();
    const el = document.createElement("div");
    el.className = "v3d";
    el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-label", short(it) + " の3D");
    el.innerHTML = `<div class="v3d-head"><h3>${esc(short(it))}</h3><button type="button" class="btn v3d-close">閉じる</button></div>
      <div class="v3d-stage"><p class="v3d-msg">読み込み中…</p><p class="v3d-hint">1本指で回転・ピンチでズーム・2本指で移動</p></div>
      <div class="v3d-foot"><small></small>
        <button type="button" class="btn v3d-wire" aria-pressed="false">ワイヤー</button><button type="button" class="btn v3d-reset">視点を戻す</button></div>`;
    document.body.appendChild(el);
    document.body.style.overflow = "hidden";
    const st = { el, alive: true, raf: 0, cleanup: [] };
    v3d = st;
    history.pushState({ v3d: 1 }, "");   // スマホの「戻る」で閉じられるように
    el.querySelector(".v3d-close").addEventListener("click", () => history.state && history.state.v3d ? history.back() : close3d());
    const msg = el.querySelector(".v3d-msg"), stage = el.querySelector(".v3d-stage");
    try {
      const [[THREE, { OrbitControls }, { GLTFLoader }, { DRACOLoader }], url] = await Promise.all([loadThree(), blobUrl(it.glb)]);
      const gltf = await new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/")).loadAsync(url);
      if (!st.alive) return;
      const css = getComputedStyle(document.documentElement);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
      stage.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(css.getPropertyValue("--bg").trim() || "#ecebe7");
      const model = gltf.scene;
      let tris = 0;
      model.traverse(o => {
        if (!o.isMesh) return;
        tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
        [].concat(o.material).forEach(m => {
          if (m.transparent) m.depthWrite = false;   // ガラスの後ろが消えないように
          m.polygonOffset = true; m.polygonOffsetFactor = 1; m.polygonOffsetUnits = 1;   // ワイヤーの線が面に埋もれないように
        });
      });
      scene.add(model);
      const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
      const maxd = Math.max(size.x, size.y, size.z) || 1;
      // 床のグリッド：1マス 25cm
      const gsize = Math.ceil(maxd * 1.5);
      const grid = new THREE.GridHelper(gsize, gsize * 4, css.getPropertyValue("--muted").trim() || "#888", css.getPropertyValue("--line").trim() || "#ccc");
      grid.position.set(center.x, box.min.y, center.z);
      scene.add(grid);
      const camera = new THREE.PerspectiveCamera(35, 1, maxd / 100, maxd * 100);
      scene.add(camera);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 1.6));
      const sun = new THREE.DirectionalLight(0xffffff, 2.2);
      sun.position.set(0.5, 1, 0.8);
      camera.add(sun);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      const fit = () => {
        const w = stage.clientWidth, h = stage.clientHeight;
        if (!w || !h) return;
        renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
      };
      const home = () => {   // 正面やや左上から、全体が収まる距離（縦長の画面では横の画角で決まる）
        const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
        const dist = size.length() / 2 / Math.sin(Math.min(vf, hf) / 2) * 0.85;
        camera.position.copy(center).add(new THREE.Vector3(-0.55, 0.45, 1).normalize().multiplyScalar(dist));
        controls.target.copy(center); controls.update();
      };
      fit();
      home();
      const ro = new ResizeObserver(fit); ro.observe(stage);
      const loop = () => { if (!st.alive) return; controls.update(); renderer.render(scene, camera); st.raf = requestAnimationFrame(loop); };
      loop();
      msg.hidden = true;
      el.querySelector(".v3d-foot small").textContent = `${Math.round(tris).toLocaleString()} tris（ベベル込み）`;
      el.querySelector(".v3d-reset").addEventListener("click", home);
      // ワイヤー：なし → 三角（GPUが描く三角形）→ 四角（Blender の辺）→ なし。線は面の上に重ねる。押したときに初めて作る
      const lineMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45 });
      const wires = {}, WIRE_NEXT = { off: "tri", tri: "quad", quad: "off" }, WIRE_TEXT = { off: "なし", tri: "三角", quad: "四角" };
      let wireMode = "off";
      const makeTri = () => {
        const g = new THREE.Group();
        model.traverse(o => { if (o.isMesh) { const l = new THREE.LineSegments(new THREE.WireframeGeometry(o.geometry), lineMat); o.updateWorldMatrix(true, false); l.applyMatrix4(o.matrixWorld); g.add(l); } });
        return g;
      };
      const wireBtn = el.querySelector(".v3d-wire");
      wireBtn.textContent = "ワイヤー：なし";
      wireBtn.addEventListener("click", async () => {
        const next = WIRE_NEXT[wireMode];
        wireBtn.disabled = true;
        try {
          if (next !== "off" && !wires[next]) wires[next] = next === "tri" ? makeTri() : new THREE.LineSegments(await loadEdges(THREE, it.glb + ".edges.bin"), lineMat);
          wireMode = next;
        } catch (e) {   // 四角が読めない（古いデータ・古い端末）ときは、なしに戻す
          wireMode = "off";
          el.querySelector(".v3d-foot small").textContent = "四角の線は読めませんでした";
        }
        if (!st.alive) return;
        Object.entries(wires).forEach(([k, w]) => { if (k === wireMode) scene.add(w); else scene.remove(w); });
        wireBtn.disabled = false;
        wireBtn.textContent = "ワイヤー：" + WIRE_TEXT[wireMode];
        wireBtn.setAttribute("aria-pressed", String(wireMode !== "off"));
      });
      st.cleanup.push(() => {
        ro.disconnect(); controls.dispose();
        model.traverse(o => { if (o.isMesh) { o.geometry.dispose(); [].concat(o.material).forEach(m => m.dispose()); } });
        Object.values(wires).forEach(w => w.traverse(o => { if (o.geometry) o.geometry.dispose(); }));
        lineMat.dispose();
        grid.geometry.dispose(); grid.material.dispose();
        renderer.dispose(); renderer.forceContextLoss();
      });
    } catch (e) {
      if (st.alive) msg.textContent = e instanceof ApiError ? errText(e) : "3Dを読めませんでした（通信を確かめて、もう一度開いてください）";
    }
  }

  function close3d() {
    if (!v3d) return;
    const st = v3d; v3d = null;
    st.alive = false; cancelAnimationFrame(st.raf);
    st.cleanup.forEach(f => { try { f(); } catch (e) {} });
    st.el.remove();
    document.body.style.overflow = "";
  }
  addEventListener("popstate", () => close3d());
  addEventListener("keydown", e => { if (e.key === "Escape" && v3d) history.state && history.state.v3d ? history.back() : close3d(); });

  function renderAll() {
    document.getElementById("title").textContent = "3Dアセット工場";
    document.getElementById("when").textContent = data ? `テーマ ${data.theme} ・ 更新 ${fmt(data.updated)} ・ 次 ${fmt(data.next_run)}` : "";
    renderReview(); renderLine(); renderLog();
    if (!document.getElementById("view-help").hidden) renderHelp();
    if (!document.getElementById("view-stage").hidden) renderStage();
  }

  async function refresh() {
    const btn = document.getElementById("reload");
    btn.classList.add("spin"); btn.disabled = true;
    loadErr = null;
    try {
      const [d] = await Promise.all([api("data.json", { raw: true }).then(r => r.json()), loadInbox(), loadRequests()]);
      // 画像はファイル名が同じまま中身が変わるので、工場の状況が更新されたら覚えている画像を捨てて取り直す
      if (!data || d.updated !== data.updated) {
        imgCache.forEach(p => p.then(u => URL.revokeObjectURL(u)).catch(() => {}));
        imgCache.clear();
      }
      data = d;
      try { localStorage.setItem("last_data", JSON.stringify(d)); } catch (e) {}
    } catch (e) {
      loadErr = errText(e);
      if (!data) { try { data = JSON.parse(localStorage.getItem("last_data") || "null"); } catch (x) {} }
      if (data) loadErr = null;
      if (e.message === "no_token") switchTab("settings");
    } finally { btn.classList.remove("spin"); btn.disabled = false; }
    renderAll();
    startPoll();
  }

  // ---------------------------------------------------------------- タブ
  function switchTab(name) {
    document.querySelectorAll(".tab").forEach(t => { if (t.dataset.tab === name) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current"); });
    document.querySelectorAll("main").forEach(m => { m.hidden = m.dataset.view !== name; });
    if (name === "settings") renderSettings();
    if (name === "help") renderHelp();
    window.scrollTo(0, 0);
    try { sessionStorage.setItem("tab", name); } catch (e) {}
  }
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));
  document.getElementById("reload").addEventListener("click", refresh);

  let startTab = "review";
  try { startTab = sessionStorage.getItem("tab") || "review"; } catch (e) {}
  if (startTab === "stage") startTab = "line";   // 一覧ページは開き直したらラインに戻す
  switchTab(startTab);
  if (cfg().token) refresh(); else { loadErr = "設定タブで鍵（トークン）を入れてください"; renderAll(); switchTab("settings"); }
})();
</script>
</body>
</html>
