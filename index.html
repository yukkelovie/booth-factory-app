<style>
/* レイアウト：上にヘッダー、下にタブバー（確認／ライン／ログ／設定）。中身は1カラムの縦スクロール */
:root {
  --bg: #ecebe7;        /* コンクリート */
  --surface: #f8f7f4;
  --ink: #1f2326;       /* アスファルト */
  --muted: #676b6e;
  --line: #d3d1cb;
  --mark: #e5b100;      /* 道路標示の黄 */
  --mark-ink: #1f2326;
  --ok: #2f7a4a;
  --warn: #b5481d;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --tabbar: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17191b; --surface: #212427; --ink: #e9e7e2; --muted: #9a9ea1; --line: #34383b;
  --mark: #f0c21a; --mark-ink: #17191b; --ok: #6cc28c; --warn: #f08a5d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17191b; --surface: #212427; --ink: #e9e7e2; --muted: #9a9ea1; --line: #34383b;
  --mark: #f0c21a; --mark-ink: #17191b; --ok: #6cc28c; --warn: #f08a5d; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.65;
  -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }

.top { position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line); }
.top-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.top h1 { margin: 0; font-size: 20px; font-weight: 900; line-height: 1.2; flex: 1; min-width: 0; }
.stripe { display: inline-block; width: 16px; height: 16px; margin-right: 8px; vertical-align: -1px;
  background: repeating-linear-gradient(-45deg, var(--mark) 0 4px, var(--ink) 4px 8px); border-radius: 3px; }
.when { margin: 2px 0 0; font-size: 12px; color: var(--muted); font-weight: 400; }
.reload { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-width: 44px; min-height: 44px;
  cursor: pointer; font-size: 18px; }
.reload.spin { animation: spin 1s linear infinite; }
.update-bar { display: block; width: 100%; max-width: 720px; margin: 8px auto 0; padding: 10px 12px; border-radius: 10px; cursor: pointer;
  border: 0; background: var(--mark); color: var(--mark-ink); font-weight: 700; min-height: 44px; }
@keyframes spin { to { transform: rotate(360deg); } }

main { max-width: 720px; margin: 0 auto;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 32px) max(16px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
h2 { font-size: 18px; font-weight: 900; margin: 6px 0 -10px; }
h2 small { font-family: var(--f-data); font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 6px; }
h4 { font-size: 13px; margin: 6px 0 0; color: var(--muted); letter-spacing: .04em; }
ul { margin: 0; padding-left: 1.2em; } li { margin: 2px 0; }
code { font-family: var(--f-data); font-size: .88em; }
.muted { color: var(--muted); margin: 0; }
.hint { font-size: 12px; margin-top: -6px; }
.banner { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--mark); color: var(--mark-ink); font-weight: 700; }
.banner.err { background: transparent; color: var(--warn); border: 1px solid var(--warn); }

/* タブバー */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { border: 0; background: transparent; min-height: var(--tabbar); display: grid; place-items: center; gap: 0; padding: 6px 0;
  cursor: pointer; color: var(--muted); position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab span { font-size: 11px; line-height: 1.2; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 700; }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; background: var(--mark); border-radius: 0 0 3px 3px; }
.badge { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
  background: var(--warn); color: #fff; font-family: var(--f-data); font-size: 11px; line-height: 18px; text-align: center; }
.tab:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }

/* ラインの状況 */
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); gap: 6px; }
.flow li { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0; text-align: center; display: grid; }
.flow-btn { border: 0; background: transparent; color: inherit; font: inherit; padding: 8px 4px; display: grid; gap: 2px; cursor: pointer; border-radius: 8px; min-height: 44px; }
.flow-btn::after { content: "›"; font-size: 11px; color: var(--muted); line-height: 1; }
.open-item { border: 0; background: transparent; color: inherit; font: inherit; padding: 0; text-align: left; display: grid; gap: 4px; cursor: pointer; width: 100%; }
.card { scroll-margin-top: 90px; }
.stage-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stage-head h2 { margin: 0; flex: 1; min-width: 0; }
.flow b { font-family: var(--f-data); font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.flow span { font-size: 11px; color: var(--muted); }
.flow li.hot { background: var(--mark); border-color: var(--mark); }
.flow li.hot b, .flow li.hot span { color: var(--mark-ink); }

/* カード */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.card h3 { margin: 0; font-size: 20px; font-weight: 900; line-height: 1.3; }
.code { margin: 0; font-family: var(--f-data); font-size: 12px; color: var(--muted); }
.dims { margin: 0; font-family: var(--f-data); font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dims span, .dims small { color: var(--muted); }
.pic { width: 100%; border-radius: 8px; border: 1px solid var(--line); background: var(--line); min-height: 120px; object-fit: contain; }
.pic.loading { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
.legend { margin: -4px 0 0; font-size: 11px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-data); font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); font-weight: 700; } .chip.plain { color: var(--muted); }
.btn.v3d-open { width: 100%; min-height: 44px; }
/* 確認タブの一番上のまとめ */
.sum { margin: 4px 0 8px; }
.sum-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.sum-tile { display: grid; gap: 0; justify-items: center; padding: 8px 2px; min-height: 60px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: inherit; }
.sum-tile b { font-family: var(--f-data); font-size: 22px; line-height: 1.2; color: var(--ink); }
.sum-tile span { font-size: 11px; white-space: nowrap; }
.sum-tile.you:not(.zero) { background: var(--mark); border-color: var(--mark); color: var(--mark-ink); }
.sum-tile.you:not(.zero) b { color: var(--mark-ink); }
.sum-tile.zero b { color: var(--muted); font-weight: 500; }
.sum-prog { margin-top: 10px; }
.sum-prog .bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.sum-prog .bar i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--mark) 0 6px, var(--ink) 6px 12px); }
.sum-prog p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
/* 4面図（タップで3D） */
.sheet { position: relative; cursor: pointer; }
.sheet .tap3d { position: absolute; right: 8px; bottom: 8px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
  background: var(--ink); color: var(--bg); opacity: .85; pointer-events: none; }
/* 前後比較：前の版の上に今の版を重ね、--x より右だけ今の版を見せる */
.cmp { position: relative; margin-top: 8px; }
.cmp .pic { margin: 0 !important; aspect-ratio: 1; }
.cmp-top { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--x)); }
.cmp-line { position: absolute; top: 0; bottom: 0; left: var(--x); width: 2px; margin-left: -1px; background: var(--mark); }
.cmp-tag { position: absolute; top: 8px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--ink); color: var(--bg); }
.cmp-tag.l { left: 8px; } .cmp-tag.r { right: 8px; background: var(--mark); color: var(--mark-ink); }
.cmp-range { width: 100%; margin: 8px 0 0; accent-color: var(--mark); }
/* 歩み */
.hist { list-style: none; margin: 8px 0 0; padding: 0 0 0 12px; border-left: 2px solid var(--line); font-size: 13px; }
.hist li { position: relative; padding: 2px 0 6px 8px; display: flex; gap: 10px; }
.hist li::before { content: ""; position: absolute; left: -18px; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--mark); }
.hist time { font-family: var(--f-data); font-size: 12px; color: var(--muted); white-space: nowrap; }
/* メモの定型文 */
.tpl { display: flex; flex-wrap: wrap; gap: 6px; }
.tpl:empty { display: none; }
.chip-btn { border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 4px 10px; min-height: 32px;
  font-size: 12px; cursor: pointer; color: var(--ink); }
/* 段の一覧のカルーセル（横スワイプで次のカード） */
.carousel { display: flex; align-items: flex-start; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
  margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; overscroll-behavior-x: contain; }
.carousel::-webkit-scrollbar { display: none; }
.carousel > .card { flex: 0 0 100%; min-width: 0; scroll-snap-align: center; margin: 0; }
.swipe-hint { margin: 0 0 6px; font-size: 12px; color: var(--muted); }
.swipe-hint .pos { font-family: var(--f-data); color: var(--ink); }
.path { display: flex; align-items: center; gap: 8px; }
.path code { flex: 1; min-width: 0; font-family: var(--f-data); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; line-height: 1.4; }
.path .btn { flex: none; padding: 6px 12px; min-height: 36px; font-weight: 400; }
/* 3Dビューア：全画面。上に名前と閉じる、真ん中にキャンバス、下に操作 */
.v3d { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
.v3d-head { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top, 0px) + 8px) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.v3d-head h3 { margin: 0; font-size: 16px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v3d-stage { flex: 1; position: relative; min-height: 0; touch-action: none; }
.v3d-stage canvas { display: block; width: 100%; height: 100%; }
.v3d-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center;
  font-size: 14px; color: var(--muted); pointer-events: none; }
.v3d-layers { display: flex; gap: 6px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line); }
.v3d-layers .btn { flex: 1; padding: 8px 4px; min-height: 40px; }
.v3d-layers .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.v3d-hint { position: absolute; left: 0; right: 0; top: 8px; margin: 0; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; }
.v3d-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 8px) max(16px, env(safe-area-inset-left, 0px)); }
.v3d-foot .btn { padding: 8px 14px; min-height: 40px; }
.v3d-foot .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.v3d-foot small { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); }
details.sub { border-top: 1px solid var(--line); padding-top: 8px; }
details.sub summary { cursor: pointer; font-size: 13px; color: var(--muted); min-height: 32px; }
details.sub .pic { margin-top: 8px; }
details.sub pre { white-space: pre-wrap; font-size: 12px; margin: 8px 0 0; font-family: var(--f-body); }
.meta { margin: 0; font-size: 11px; color: var(--muted); font-family: var(--f-data); }

/* 返事 */
.decide { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.btns.one { grid-template-columns: 1fr; } .btns.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.btns.prepfix { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.shots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.shots img { width: 100%; height: auto; border-radius: 6px; display: block; }
pre.desc { white-space: pre-wrap; word-break: break-word; font-size: 13px; max-height: 420px; overflow-y: auto; }
.btns.prepfix .act-fix { background: var(--surface) !important; border-color: var(--line) !important; color: var(--ink); }   /* OK済みの直しは控えめに */
.decide button, .btn { font-weight: 700; padding: 10px 6px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); cursor: pointer; min-height: 44px; }
.decide button:disabled, .btn:disabled { opacity: .45; cursor: default; }
.act-ok, .act-prep_ok { background: var(--ok) !important; border-color: var(--ok) !important; color: var(--surface); }
.act-fix, .act-prep_fix, .act-prep, .btn.primary { background: var(--mark) !important; border-color: var(--mark) !important; color: var(--mark-ink); }
.act-reject { color: var(--warn); border-color: var(--warn) !important; background: transparent !important; }
.fixbox { display: grid; gap: 6px; }
.fixbox label { font-size: 13px; color: var(--muted); }
textarea, input[type="text"], input[type="password"] { font-size: 16px; width: 100%; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); resize: vertical; }
.photo-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.photo-row .btn { font-weight: 400; min-height: 40px; padding: 6px 14px; }
.thumbs { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs:empty { display: none; }
.thumbs li { margin: 0; position: relative; width: 72px; height: 72px; }
.thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--line); }
.thumbs .rm { position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; min-height: 0; padding: 0; border-radius: 999px;
  font-size: 14px; line-height: 1; background: var(--ink); color: var(--surface); border: 2px solid var(--surface); }
.sent { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; background: var(--bg); }
.sent p { margin: 0; font-weight: 700; min-width: 0; }
.sent .btn { background: transparent; min-height: 36px; padding: 6px 12px; font-weight: 400; }
.state { margin: 0; font-size: 12px; color: var(--muted); }
.state:empty { display: none; }

/* 棚（サムネ一覧） */
.shelf { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.shelf > li { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 4px; min-width: 0; align-content: start; }
.shelf .pic { aspect-ratio: 1; min-height: 0; object-fit: cover; border-radius: 6px; }
.s-name { margin: 0; font-weight: 700; font-size: 14px; line-height: 1.3; }
.s-meta { margin: 0; font-family: var(--f-data); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.shelf .decide { padding-top: 8px; gap: 6px; }
.shelf .decide button { font-size: 13px; }

.queue { list-style: none; margin: 0; padding: 0; }
.queue li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); margin: 0; }
.queue li:first-child span::before { content: "次 "; font-family: var(--f-data); font-size: 11px; background: var(--mark); color: var(--mark-ink); padding: 1px 6px; border-radius: 4px; margin-right: 6px; }
.queue code { color: var(--muted); font-size: 12px; }
.logs { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.logs > li { margin: 0; }
.log-h { margin: 0; font-family: var(--f-data); font-size: 12px; color: var(--muted); }
.logs ul { font-size: 13px; }
.form { display: grid; gap: 8px; }
.form label { font-size: 13px; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .btn { padding: 10px 16px; }
ol.steps { margin: 0; padding-left: 1.4em; font-size: 14px; }

/* 使い方 */
.help-sec { scroll-margin-top: 90px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.help-sec h3 { margin: 0; font-size: 17px; font-weight: 900; }
.help-sec p { margin: 0; }
.help-toc { display: flex; flex-wrap: wrap; gap: 6px; }
.ex-steps { list-style: none; padding: 0; margin: 0; }
.ex-steps li { margin: 0 0 20px; }
.ex-steps h4 { margin: 14px 0 6px; font-size: 15px; }
.ex-steps p { font-size: 14px; margin: 6px 0 0; }
.ex-steps .pic { width: 100%; border-radius: 10px; }
.help-toc a { font-size: 13px; color: var(--ink); text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.fl { display: grid; gap: 0; justify-items: stretch; }
.fl-step { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.fl-step.you { background: var(--mark); border-color: var(--mark); color: var(--mark-ink); }
.fl-step.you small { color: var(--mark-ink); opacity: .8; }
.fl-ico { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--surface); font-size: 18px; }
.fl-step.you .fl-ico { background: var(--surface); color: var(--ink); }
.fl-step b { display: block; line-height: 1.35; }
.fl-step small { display: block; color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 2px; }
.fl-arrow { text-align: center; color: var(--muted); line-height: 1; padding: 4px 0; font-size: 14px; }
.fl-branch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.fl-branch > div { border-radius: 8px; padding: 8px; font-size: 12px; line-height: 1.45; border: 1px solid var(--line); background: var(--bg); min-width: 0; }
.fl-branch b { display: block; font-size: 13px; }
.fl-branch .ok { border-color: var(--ok); } .fl-branch .ok b { color: var(--ok); }
.fl-branch .fix { border-color: var(--mark); } .fl-branch .fix b { color: var(--ink); }
.fl-branch .ng { border-color: var(--warn); } .fl-branch .ng b { color: var(--warn); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { margin: 0; display: grid; grid-template-columns: 54px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.timeline li:last-child { border-bottom: 0; }
.timeline time { font-family: var(--f-data); font-size: 13px; color: var(--muted); }
.anno { position: relative; }
.anno .tag { position: absolute; font-size: 11px; font-weight: 700; background: var(--mark); color: var(--mark-ink); padding: 1px 7px; border-radius: 999px; }
.demo-btns { pointer-events: none; }
dl.faq { margin: 0; display: grid; gap: 12px; }
dl.faq dt { font-weight: 700; }
dl.faq dd { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.stage-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.stage-tbl th, .stage-tbl td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.stage-tbl th { white-space: nowrap; }
.stage-tbl td.you { font-weight: 700; }
@media (max-width: 420px) { .flow b { font-size: 18px; } }
</style>
</head>
<body>

    <button class="tab" type="button" data-tab="log">

    <button class="tab" type="button" data-tab="help">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M10 8.5a2 2 0 1 1 2.5 1.9c-.4.2-.5.5-.5.9V12M12 14.5h.01"/></svg>
      <span>使い方</span>
    </button>
    <button class="tab" type="button" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>設定</span>
    </button>

</nav>

<script>
(() => {
  // ---------------------------------------------------------------- 設定・GitHub API
  // データは非公開リポジトリ（data.json と img/）、返事は同じリポジトリの inbox/ にファイルで置く。PCの見張りが5分おきに読んで振り分ける
  const DEFAULT_REPO = "yukkelovie/booth-factory";
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} mem[k] = v; },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} delete mem[k]; },
  };
  const mem = {};
  const cfg = () => ({ token: store.get("gh_token") || "", repo: store.get("gh_repo") || DEFAULT_REPO });

  class ApiError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
  async function api(path, { method = "GET", body, raw = false } = {}) {
    const { token, repo } = cfg();
    if (!token) throw new ApiError(0, "no_token");
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
      method, cache: "no-store",
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        ...(body ? { "Content-Type": "application/json" } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) {
      const limited = r.status === 429 || (r.status === 403 && r.headers.get("x-ratelimit-remaining") === "0");
      throw new ApiError(limited ? 429 : r.status === 403 && method !== "GET" ? 4031 : r.status, `${r.status}`);
    }
    return r;
  }
  const b64utf8 = s => { const u = new TextEncoder().encode(s); let b = ""; for (const c of u) b += String.fromCharCode(c); return btoa(b); };
  const blobB64 = blob => new Promise((ok, ng) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(",")[1]); fr.onerror = ng; fr.readAsDataURL(blob); });
  const errText = e => e.message === "no_token" ? "設定タブで鍵（トークン）を入れてください"
    : e.status === 401 ? "鍵（トークン）が無効です。設定タブで入れ直してください"
    : e.status === 4031 ? "鍵に書き込みの権限がありません。GitHub でこの鍵を Edit して、Contents を「Read and write」にしてください"
    : e.status === 403 ? "鍵に booth-factory を読む権限がありません。鍵の Repository access を確認してください"
    : e.status === 429 ? "GitHub の回数制限です。少し待ってからもう一度押してください"
    : e.status === 404 ? "リポジトリが見つかりません（鍵の対象リポジトリを確認）"
    : e.status === 409 || e.status === 422 ? "他の送信とぶつかりました。もう一度押してください"
    : "通信できませんでした（" + (e.status || "オフライン") + "）";

  // 画像・3Dは非公開なので、鍵付きで取ってきて blob URL にする
  const imgCache = new Map();
  function blobUrl(path) {
    if (!imgCache.has(path)) {
      const p = api(path, { raw: true }).then(r => r.blob()).then(b => URL.createObjectURL(b));
      p.catch(() => imgCache.delete(path));
      imgCache.set(path, p);
    }
    return imgCache.get(path);
  }
  function loadImg(el) {
    const path = el.dataset.src;
    if (!path) return;
    blobUrl(path).then(u => { el.src = u; el.classList.remove("loading"); })
      .catch(() => { el.classList.remove("loading"); el.alt = "画像を読めませんでした"; });
  }
  const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { io.unobserve(e.target); loadImg(e.target); }
  }), { rootMargin: "400px" }) : null;
  const hydrateImgs = root => root.querySelectorAll("img[data-src]").forEach(el => io ? io.observe(el) : loadImg(el));

  // ---------------------------------------------------------------- 描画
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>");
  const fmt = iso => { if (!iso) return ""; const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; };
  const pic = (path, alt, cls = "pic") => path ? `<img class="${cls} loading" data-src="${esc(path)}" alt="${esc(alt)}">` : "";
  const list = (title, xs) => xs && xs.length ? `<h4>${title}</h4><ul>${xs.map(x => `<li>${md(x)}</li>`).join("")}</ul>` : "";
  const short = it => it.name.split("／")[0];

  const LABEL = { ok: "OK", fix: "直して", reject: "ボツ", prep: "整えた", prep_ok: "工程C確定", prep_fix: "工程Cの直し", back_ok: "OK済みに戻す", unreject: "ボツ取り消し",
    tex_done: "テクスチャ完了", tex_ok: "テクスチャOK", tex_fix: "塗り直し", unity_done: "Unity完了", released: "出品した", unity_back: "Unityに戻す" };
  const MODES = {
    review: { acts: ["ok", "fix", "reject"], cls: "", note: { fix: ["直してほしいこと", "例：支柱をもう少し太く。屋根はフラットに"] } },
    // OK済みからも「直して」で作り直しに戻せる（Blenderで整えた .blend は _backup に残る）
    prep: { acts: ["prep", "fix"], cls: "prepfix", note: { prep: ["工程Cへのメモ（なくてもOK）", "例：扉はギミックにしたい／UVはそのまま"],
      fix: ["作り直してほしいこと", "例：脚をもう少し太く（Blenderで整えた分は _backup に残ります）"] } },
    prep_shelf: { acts: ["prep"], cls: "one", note: { prep: ["工程Cへのメモ（なくてもOK）", "例：扉はギミックにしたい／UVはそのまま"] } },   // 小さいサムネ用（直しは大きいカードで）
    prep_review: { acts: ["prep_ok", "prep_fix", "back_ok"], cls: "", note: { prep_fix: ["工程Cへの直し", "例：取っ手の面は消さないで／ガラスは別のテクスチャセットに"] } },
    // テクスチャ（2026-10-24）：塗り終えたら「テクスチャ完了」→ テクスチャ確認待ちでテクスチャ込みの3Dを見て OK なら Unity 待ちへ
    texturing: { acts: ["tex_done", "back_ok"], cls: "", note: {} },
    tex_review: { acts: ["tex_ok", "tex_fix"], cls: "", note: { tex_fix: ["塗り直すところのメモ（なくてもOK）", "例：バーの黄色をもう少し濃く"] } },
    // Unity待ちからも塗り直しに戻せる（フォルダごと＝.spp・テクスチャ・FBX もテクスチャ待ちへ）
    // 出品（2026-10-28）：unitypackage を書き出したら「Unity完了」→ 出品待ち → BOOTH に出したら「出品した」→ 出品済み。版を上げるときは「Unityに戻す」
    unity: { acts: ["unity_done", "tex_fix"], cls: "two", note: { tex_fix: ["塗り直すところのメモ（なくてもOK）", "例：コーンの汚れを少なく"] } },
    release: { acts: ["released", "unity_back"], cls: "two", note: {} },
    released: { acts: ["unity_back"], cls: "one", note: { unity_back: ["直すところのメモ（なくてもOK）", "例：v1.1 でコライダーを箱に"] } },
    rejected: { acts: ["unreject"], cls: "one", note: {} },
  };
  const BTN_TEXT = { ok: "OK", fix: "直して", reject: "ボツ", prep: "整えた → 工程Cへ", prep_ok: "OK（確定）", prep_fix: "直して",
    back_ok: "OK済みに戻す（整え直す）", unreject: "確認待ちに戻す", tex_done: "テクスチャ完了 → 確認へ", tex_ok: "OK → Unityへ", tex_fix: "塗り直す",
    unity_done: "Unity完了 → 出品待ちへ", released: "出品した", unity_back: "Unityに戻す（版を上げる）" };
  const BTN_TEXT_IN = { prep_review: { back_ok: "整え直す" }, texturing: { back_ok: "整え直す" }, unity: { unity_done: "Unity完了", tex_fix: "塗り直す" }, release: { unity_back: "Unityに戻す" } };   // 3つ並ぶところは短く
  const NOTE_REQUIRED = ["fix", "prep_fix"];
  // メモの定型文（押すとメモ欄に足す。◯ は選んだ状態になるので、そのまま数字を打てる）
  const TEMPLATES = {
    fix: ["もう少し太く", "もう少し細く", "全体を一回り大きく", "高さを◯cmに", "実物の写真みたいに", "めり込みをなくして", "色を変えて："],
    prep: ["UVはそのまま", "扉をギミックに", "ビスも丸めて", "これは地面に固定", "底を開けて中空に", "◯は取り外せる部品（当たり面を残して丸める）"],
    prep_fix: ["この面は消さないで", "丸めを弱く", "丸めを強く", "ガラスは別のセットに", "これは地面に固定", "◯は取り外せる部品（当たり面を残して丸める）"],
  };

  function decideUI(it, mode) {
    const m = MODES[mode];
    return `<div class="decide" data-item="${esc(it.id)}" data-mode="${mode}">
      <div class="btns ${m.cls}">${m.acts.map(a => `<button type="button" class="act-${a}" data-act="${a}">${(BTN_TEXT_IN[mode] || {})[a] || BTN_TEXT[a]}</button>`).join("")}</div>
      <div class="fixbox" hidden>
        <label></label>
        <textarea rows="3"></textarea>
        <div class="tpl" aria-label="よく使う言い回し"></div>
        <div class="photo-row">
          <input type="file" accept="image/*" multiple hidden>
          <button type="button" class="btn add-photo">写真を追加</button>
          <span class="muted" style="font-size:12px">参考写真・スクショ（4枚まで）</span>
        </div>
        <ul class="thumbs"></ul>
        <button type="button" class="btn primary send">送る</button>
      </div>
      <div class="sent" hidden><p></p><div class="row"><button type="button" class="btn primary now" hidden></button><button type="button" class="btn undo">取り消す</button></div></div>
      <p class="state" aria-live="polite"></p>
    </div>`;
  }

  // たためる箇条書き（中身があるときだけ）。open で最初から開く
  const fold = (title, xs, open) => xs && xs.length ? `<details class="sub"${open ? " open" : ""}><summary>${title}（${xs.length}）</summary><ul>${xs.map(x => `<li>${md(x)}</li>`).join("")}</ul></details>` : "";
  const fmtAt = s => { const m = /^\d{4}-(\d{2})-(\d{2}) (\d{2}:\d{2})/.exec(s || ""); return m ? `${+m[1]}/${+m[2]} ${m[3]}` : esc(s); };

  // 4面図。押すと3Dが開く（GLB があるとき）
  const sheetPic = it => it.img.sheet
    ? `<div class="sheet"${it.glb ? ` data-v3d="${esc(it.id)}" role="button" tabindex="0" aria-label="${esc(short(it))} を3Dで見る"` : ""}>${pic(it.img.sheet, it.id + " の4面図（正面・左側面・上面・パース）")}${it.glb ? '<span class="tap3d">タップで3D</span>' : ""}</div>
       <p class="legend">左上 正面 ／ 右上 左側面 ／ 左下 上面 ／ 右下 パース</p>`
    : '<p class="muted">画像なし</p>';

  // 工程Cの確認画像。押すと3D確認がその層で開く（消す面／丸める角／ローポリ）
  const chkPic = (it, path, alt, layer) => it.prep && it.prep.check_glb
    ? `<div class="sheet" data-v3d-check="${esc(it.id)}" data-layer-start="${layer}" role="button" tabindex="0" aria-label="${esc(alt)}を3Dで見る">${pic(path, alt)}<span class="tap3d">タップで3D</span></div>`
    : pic(path, alt);

  // 直す前と比べる：前の版の上に今の版を重ねて、スライダーで境目を動かす
  const compare = it => it.img.sheet_prev ? `<details class="sub cmp-box"><summary>直す前と比べる（前の版 ${fmtAt(it.prev_built)}）</summary>
      <div class="cmp" style="--x:50%">${pic(it.img.sheet_prev, "前の版の4面図")}<div class="cmp-top">${pic(it.img.sheet, "今の4面図")}</div><i class="cmp-line"></i>
        <span class="cmp-tag l">前</span><span class="cmp-tag r">今</span></div>
      <input type="range" class="cmp-range" min="0" max="100" value="50" aria-label="前と今の境目">
    </details>` : "";

  // アイテムの歩み（作成・返事・作り直し・工程C）
  const historyList = it => (it.history || []).length ? `<details class="sub"><summary>歩み（${it.history.length}）</summary>
      <ol class="hist">${it.history.map(e => `<li><time>${fmtAt(e.at)}</time><span>${esc(e.what)}</span></li>`).join("")}</ol></details>` : "";

  // Unity から書き出した unitypackage（products\<パック>\<Item>\ にある物。Unity待ち・出品待ち・出品済みだけ）
  function pkgRow(it) {
    if (!it.packages) return "";
    return it.packages.length
      ? `<p class="meta">unitypackage：${it.packages.map(n => `<code>${esc(n)}</code>`).join("・")}</p>`
      : `<p class="meta">unitypackage：まだありません（Unity で書き出すと <code>products\\StreetPack\\${esc(it.id)}\\</code> に入ります）</p>`;
  }

  // 出品準備（工程D）：Unity で撮ったスクショと BOOTH 説明文。説明文は「コピー」で BOOTH にそのまま貼れる
  function releaseBlock(it) {
    const r = it.release;
    if (!r) return "";
    const shots = r.shots.length
      ? `<div class="shots">${r.shots.map(s => pic(s.img, s.name)).join("")}</div><p class="legend">${r.shots.map(s => esc(s.name)).join("・")}（PC の <code>${esc(r.shots_dir)}</code> に原寸の PNG）</p>`
      : `<p class="muted">スクショはまだありません。朝7:00のラインか「今すぐ（出品準備）」で Unity が撮ります（unitypackage が要ります）。</p>`;
    const desc = r.desc
      ? `<details class="sub" open><summary>BOOTH 説明文</summary><div class="row" style="justify-content:flex-end"><button type="button" class="btn copy-desc" data-item="${esc(it.id)}">コピー</button></div><pre class="desc">${esc(r.desc)}</pre><p class="legend">${esc(r.desc_path)}</p></details>`
      : `<p class="muted">説明文はまだありません（スクショのあとに工程Dが書きます）。</p>`;
    // BOOTH のサムネ（products\<パック>\<Item>\BOOTH_Images\Thumbnail\*.png）。置き場所のパスも出す
    const thumbDir = r.thumb_dir || `products\\StreetPack\\${it.id}\\BOOTH_Images\\Thumbnail`;
    const thumbs = (r.thumbs || []).length
      ? `<details class="sub" open><summary>BOOTH サムネ</summary>${r.thumbs.map(t => `${pic(t.img, t.name)}<p class="legend">${esc(t.name)}（PC の <code>${esc(t.path)}</code>）</p>`).join("")}</details>`
      : `<p class="muted">サムネはまだありません（<code>${esc(thumbDir)}\\</code> に PNG を置くとここに出ます）。</p>`;
    // ターンテーブルの GIF（BOOTH_Images\Turntable\*.gif）。動いたまま見せる
    const turns = (r.turntables || []).length
      ? `<details class="sub" open><summary>ターンテーブル（GIF）</summary>${r.turntables.map(t => `${pic(t.img, t.name)}<p class="legend">${esc(t.name)}（PC の <code>${esc(t.path)}</code>）</p>`).join("")}</details>`
      : `<p class="muted">ターンテーブルはまだありません（<code>${esc(r.turn_dir || "BOOTH_Images\\Turntable")}\\</code> に GIF を置くとここに出ます）。</p>`;
    return `<h4>出品の準備</h4>${thumbs}${turns}${shots}${desc}${list("確認してほしい点", r.notes)}`;
  }

  function card(it, mode) {
    const d = it.dims || [0, 0, 0];
    const fb = it.feedback ? `<details class="sub"><summary>feedback.md</summary><pre>${esc(it.feedback)}</pre></details>` : "";
    return `<article class="card" id="item-${esc(it.id)}">
      <header class="card-head"><div><h3>${esc(it.name)}</h3><p class="code">${esc(it.id)}</p></div>
        <p class="dims">${d[0].toFixed(2)}<span>×</span>${d[1].toFixed(2)}<span>×</span>${d[2].toFixed(2)}<small> m</small></p></header>
      ${sheetPic(it)}
      ${texRow(it)}
      <div class="chips">
        <span class="chip ${it.tris <= it.budget ? "ok" : "warn"}">ポリ ${it.tris.toLocaleString()} / ${it.budget.toLocaleString()}</span>
        <span class="chip ${it.floating ? "warn" : "ok"}">${it.floating ? "浮き " + it.floating : "浮きなし"}</span>
        <span class="chip plain">マテリアル ${esc(it.materials ?? "—")}</span>
      </div>
      ${mode ? decideUI(it, mode) : ""}
      ${fold("見てほしい点", it.look, mode === "review")}
      ${compare(it)}
      ${fold("工程Bで直したこと", it.fixed, false)}
      ${historyList(it)}
      ${it.img.uv || it.img.uv_layout ? `<details class="sub"><summary>UV（展開図・チェッカー）</summary>
        ${it.img.uv_layout ? `<h4>展開図</h4>${pic(it.img.uv_layout, "UV展開図")}` : ""}
        ${it.img.uv ? `<h4>チェッカー（市松模様がゆがんでいなければOK）</h4>${pic(it.img.uv, "UVチェッカー")}` : ""}
      </details>` : ""}
      ${it.prep ? uvSets(it) : ""}
      ${pkgRow(it)}
      ${releaseBlock(it)}
      ${fb}
      ${pathRow(it)}
      <p class="meta">ビルド ${esc(it.built)}</p>
    </article>`;
  }

  // テクスチャ込みの3D（テクスチャ確認待ち・Unity待ち。Textures/ の書き出しから工場が作る）
  const texRow = it => !it.tex ? "" : it.tex.glb
    ? `<button type="button" class="btn primary v3d-open" data-v3d-tex="${esc(it.id)}">テクスチャ込みの3Dで見る</button>${(it.tex.missing || []).length ? `<p class="muted" style="font-size:12px">足りないもの：${esc(it.tex.missing.join("、"))}</p>` : ""}`
    : `<div class="banner err"><p>テクスチャ込みの3Dが作れませんでした。Textures/ に書き出しがあるか確かめてください（足りないもの：${esc((it.tex.missing || []).join("、") || "—")}）</p></div>`;

  // PCで開くファイルの場所（PCのブラウザなら「コピー」してエクスプローラーや Blender の「開く」に貼れる）
  const pathRow = it => it.path ? `<div class="path"><code>${esc(it.path)}</code><button type="button" class="btn copy-path" data-path="${esc(it.path)}">コピー</button></div>` : "";
  const v3dBtn = (it, sub = "") => it.glb ? `<button type="button" class="btn v3d-open" data-v3d="${esc(it.id)}">3Dで回して見る${sub}</button>` : "";

  // 工程Cのテクスチャセットごとの UV 展開図（Print で始まるセットは写真・ラベル用）
  function uvSets(it) {
    const s = Object.entries((it.img && it.img.uv_sets) || {}).filter(([, path]) => path);
    if (!s.length) return "";
    return `<details class="sub"><summary>UV展開図（テクスチャセットごと・${s.length}枚）</summary>
      ${s.map(([name, path]) => `<h4>${esc(name)}${/^print/i.test(name) ? "（写真・ラベル用。上向きのまま）" : ""}</h4>${pic(path, name + " のUV展開図")}`).join("")}
    </details>`;
  }

  function prepCard(it) {
    const p = it.prep || {};
    return `<article class="card" id="item-${esc(it.id)}">
      <header class="card-head"><div><h3>${esc(short(it))}</h3><p class="code">${esc(it.id)} ・ 工程Cの仮の結果</p></div></header>
      ${(p.warnings || []).length ? `<div class="banner err">${p.warnings.map(w => `<p>⚠ ${esc(w)}</p>`).join("")}</div>` : ""}
      ${it.img.hidden ? `<h4>消す面（赤）</h4>${chkPic(it, it.img.hidden, "削除面プレビュー", "CHK_hidden")}<p class="legend">赤＝消す（部品に完全に埋まった面）／オレンジ＝一部隠れ（残す）／半透明＝残す</p>` : ""}
      <div class="chips">
        <span class="chip warn">消す ${p.removed ?? 0} 面</span>
        <span class="chip plain">low ${(p.low_tris || 0).toLocaleString()} tris</span>
        <span class="chip plain">high ${(p.high_tris || 0).toLocaleString()} tris</span>
        <span class="chip plain">ギミック ${esc((p.gimmicks || []).join("、") || "なし")}</span>
        ${p.ground ? `<span class="chip plain">${p.ground === "fixed" ? "地面に固定（下の角は丸めない）" : "置いてある（下の角も丸める）"}</span>` : ""}
      </div>
      ${p.check_glb ? `<button type="button" class="btn primary v3d-open" data-v3d-check="${esc(it.id)}">3Dで確認（消す面／丸める角／ローポリ／ハイポリ）</button>` : ""}
      ${v3dBtn(it, "（整えた .blend）")}
      ${it.img.sets ? `<h4>パーツ分け・テクスチャセット（色＝セット）</h4>${chkPic(it, it.img.sets, "テクスチャセット色分け", "CHK_low")}` : ""}
      ${(p.objects || []).length ? `<h4>オブジェクト</h4><ul>${p.objects.map(o => `<li><code>${esc(o.name)}</code> ${o.tris.toLocaleString()} tris ・ ${esc(o.sets.join(" / "))}</li>`).join("")}</ul>` : ""}
      ${(p.assets || []).length ? `<h4>販売単位（Unity のプレハブにする単位）</h4><ul>${p.assets.map(a => `<li><b>${esc(a.name)}</b>${a.children.length ? `（子：${esc(a.children.join("、"))}）` : ""}・ピボット＝${a.pivot === "bottom" ? "底の中心" : "中心"}・<code>${esc((a.files[0] || "").replace("_prep/", ""))}</code></li>`).join("")}</ul>
        <p class="legend">セットの並べ方（Blender の座標・m。Unity では高さが Y）：${p.assets.map(a => a.set.map(s => `${esc(a.name)} (${s.map(x => +x.toFixed(3)).join(", ")})`).join("、")).join("、")}</p>` : ""}
      ${Object.keys(p.sets || {}).length ? `<h4>テクスチャセット</h4><ul>${Object.entries(p.sets).map(([s, os]) => `<li><b>${esc(s)}</b>：${esc(os.join("、"))}</li>`).join("")}</ul>` : ""}
      ${it.img.bevel ? `<h4>ハイポリで丸める角（オレンジ）</h4>${chkPic(it, it.img.bevel, "ハイポリで丸める角", "CHK_bevel")}<p class="legend">オレンジ＝丸める角（見やすいよう太めに描いてある）。灰色のままの部品は丸めない</p>` : ""}
      ${(p.bevel || []).length ? `<details class="sub"><summary>部品ごとの丸め幅（${p.bevel.length} 行）</summary><ul>${p.bevel.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}
      ${uvSets(it)}
      ${list("確認してほしい点", p.look)}
      ${pathRow(it)}
      ${decideUI(it, "prep_review")}
    </article>`;
  }

  function shelf(its, mode) {
    return `<ul class="shelf">${its.map(it => {
      const d = it.dims || [0, 0, 0];
      const meta = it.prep && ["60_texturing", "65_texture_review", "70_unity"].includes(it.stage)
        ? `low ${(it.prep.low_tris || 0).toLocaleString()} ・ high ${(it.prep.high_tris || 0).toLocaleString()} tris ・ ${Object.keys(it.prep.sets || {}).length}セット`
        : `${d[0].toFixed(2)}×${d[1].toFixed(2)}×${d[2].toFixed(2)} m ・ ${it.tris.toLocaleString()} tris`;
      return `<li><button type="button" class="open-item" data-open-stage="${esc(it.stage)}" data-open-item="${esc(it.id)}" aria-label="${esc(short(it))} の詳細を見る">${pic(it.img.persp, it.id + " のパース")}<p class="s-name">${esc(short(it))} ›</p><p class="s-meta">${meta}</p></button>${mode ? decideUI(it, mode) : ""}</li>`;
    }).join("")}</ul>`;
  }

  let data = null, inbox = {}, loadErr = null;
  const byStage = s => data ? data.items.filter(i => i.stage === s) : [];

  // 確認タブの一番上：今やること（あなたの番＝黄色）と工場の番、テーマの進み具合。マスを押すとその段の一覧
  function summary() {
    const tiles = [["20_ready", "確認待ち", true], ["55_prep_review", "C確認", true], ["40_approved", "整え待ち", true],
      ["65_texture_review", "テクスチャ確認", true], ["30_feedback", "直し待ち", false], ["60_texturing", "塗り待ち", false], ["70_unity", "Unity待ち", false], ["80_release", "出品待ち", false]];
    const done = data.ideas_done || 0, total = data.ideas_total || 0;
    return `<section class="sum" aria-label="今の状況">
      <div class="sum-tiles">${tiles.map(([s, l, you]) => { const n = byStage(s).length;
        return `<button type="button" class="sum-tile${you ? " you" : ""}${n ? "" : " zero"}" data-open-stage="${s}" aria-label="${l} ${n}件の一覧"><b>${n}</b><span>${l}</span></button>`; }).join("")}</div>
      ${total ? `<div class="sum-prog"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><i style="width:${Math.round(done / total * 100)}%"></i></div>
        <p>${esc(data.theme)}：作ったもの ${done} / ${total} 点（残り ${total - done}）</p></div>` : ""}
    </section>`;
  }

  function renderReview() {
    const el = document.getElementById("view-review");
    if (!data) { el.innerHTML = noData(); return; }
    const ready = byStage("20_ready"), prep = byStage("55_prep_review"), ok = byStage("40_approved"), texr = byStage("65_texture_review");
    el.innerHTML = `
      ${summary()}
      ${data.exhausted ? '<p class="banner">テーマのアイデアが尽きました。次のテーマを決めてください。</p>' : ""}
      <h2>確認待ち <small>${ready.length} 点</small></h2>
      ${ready.map(it => card(it, "review")).join("") || '<p class="muted">確認待ちはありません。次は朝7時のラインで届きます。</p>'}
      ${prep.length ? `<h2>工程C確認待ち <small>${prep.length} 点</small></h2><p class="muted hint">消す面とパーツ分けを確認して「OK（確定）」でテクスチャ待ちへ。直す所があれば「直して」</p>${prep.map(prepCard).join("")}` : ""}
      ${texr.length ? `<h2>テクスチャ確認待ち <small>${texr.length} 点</small></h2><p class="muted hint">「テクスチャ込みの3Dで見る」で確かめて、OK なら Unity 待ちへ。直すなら「塗り直す」でテクスチャ待ちに戻ります</p>${texr.map(it => card(it, "tex_review")).join("")}` : ""}
      ${ok.length ? `<h2>OK済み <small>${ok.length} 点</small></h2><p class="muted hint">Blenderで整えたら「整えた」を押すと、翌朝の工程Cが仕上げ前処理をします。作り直したいときはサムネを押して、大きいカードの「直して」</p>${shelf(ok, "prep_shelf")}` : ""}
      <p class="muted" style="font-size:12px">返事はPCが5分以内に各段へ振り分けます（OK → OK済み、直して → 直し待ち、ボツ → ボツ）。作り直しは翌朝7:00のラインか「今すぐ直す」で。</p>`;
    wireDecide(el);
    hydrateImgs(el);
    const n = ready.length + prep.length + texr.length;
    const b = document.getElementById("badge");
    b.textContent = n; b.hidden = !n;
  }

  function renderLine() {
    const el = document.getElementById("view-line");
    if (!data) { el.innerHTML = noData(); return; }
    const counts = [[data.todo.length, "待ち行列", "todo"], ...data.stages.map(s => [byStage(s.id).length, s.label, s.id])];
    const sections = [["30_feedback", "直し待ち", "翌朝7:00の工程Aが作り直します（1回に3件まで。古い順）"], ["10_blockout", "工程A済み", "工程Bの検品待ち"],
      ["50_prep", "工程C待ち", "翌朝7:00の工程Cで、見えない面の削除・パーツ分け・UV・FBX書き出しを仮でやります"],
      ["60_texturing", "テクスチャ待ち", "_prep フォルダの FBX を Substance Painter へ（塗るのは「名前_low.fbx」、ベイクは bake があればそちら。.spp は Substance/、書き出しは Textures/ へ）。塗り終えたら「テクスチャ完了」"],
      ["65_texture_review", "テクスチャ確認待ち", "テクスチャ込みの3Dを見て OK なら Unity 待ちへ"], ["70_unity", "Unity待ち", "Unity で「Catalana → 工場から取り込む」→ 見た目を確かめて unitypackage に書き出したら「Unity完了」"],
      ["80_release", "出品待ち", "工場がスクショと BOOTH 説明文を用意します（朝7:00か「今すぐ出品準備」）。サムネを作って BOOTH に出したら「出品した」"], ["90_released", "出品済み", ""],
      ["99_rejected", "ボツ", ""]];
    el.innerHTML = runPanel() + `
      <ol class="flow" aria-label="ラインの状況（押すと一覧へ）">${counts.map(([n, l, id]) => `<li class="${l === "確認待ち" && n ? "hot" : ""}"><button type="button" class="flow-btn" data-open-stage="${id}" aria-label="${l} ${n}件の一覧"><b>${n}</b><span>${l}</span></button></li>`).join("")}</ol>
      ${sections.map(([s, l, h]) => {
        const its = byStage(s);
        if (!its.length) return "";
        // 直し待ち・工程C待ちは、段の見出しから「今すぐ」を頼める（点検などカード以外の理由で入った物にも使える。2026-10-23）
        const nm = STAGE_NOW[s];
        const head = nm ? `<div class="row stage-head" style="align-items:center;justify-content:space-between"><h2>${l} <small>${its.length} 点</small></h2><button type="button" class="btn primary stage-now" data-mode="${nm}"></button></div>`
          : `<h2>${l} <small>${its.length} 点</small></h2>`;
        return `${head}${h ? `<p class="muted hint">${h}</p>` : ""}${s === "30_feedback" ? its.map(it => card(it)).join("") : shelf(its)}`;
      }).join("")}
      <h2>次に作るもの <small>${data.todo.length} 件</small></h2>
      <ul class="queue">${data.todo.slice(0, 8).map(t => `<li><span>${esc(t.name)}</span><code>${esc(t.code)}</code></li>`).join("") || "<li><span>待ち行列は空です</span></li>"}</ul>
      ${data.todo.length > 8 ? `<p class="muted">ほか ${data.todo.length - 8} 件</p>` : ""}`;
    wireRun();
    el.querySelectorAll(".stage-now").forEach(b => {
      paintNow(b);
      b.addEventListener("click", async () => {
        b.disabled = true; b.textContent = "依頼中…";
        try { await requestRun(b.dataset.mode); } catch (e) { b.textContent = errText(e); b.disabled = false; return; }
        paintNow(b);
      });
    });
    hydrateImgs(el);
  }

  function renderLog() {
    const el = document.getElementById("view-log");
    const sent = Object.values(inbox);
    el.innerHTML = `
      <h2>送った返事 <small>${sent.length} 件</small></h2>
      ${sent.length ? `<ul class="logs">${sent.map(d => `<li><p class="log-h">${fmt(d.at)} ・ 5分以内に振り分け</p><ul><li><b>${esc(d.item)}</b>：${esc(LABEL[d.action] || d.action)}${d.note ? "「" + esc(d.note) + "」" : ""}${(d.photos || []).length ? `（写真${d.photos.length}枚）` : ""}</li></ul></li>`).join("")}</ul>` : '<p class="muted">まだ反映されていない返事はありません。</p>'}
      <h2>工場のログ</h2>
      ${data ? `<ul class="logs">${data.logs.map(l => `<li><p class="log-h">${esc(l.title)}</p><ul>${l.lines.map(x => `<li>${md(x)}</li>`).join("")}</ul></li>`).join("")}</ul>` : noData()}`;
  }

  function renderSettings() {
    const el = document.getElementById("view-settings");
    const c = cfg();
    el.innerHTML = `
      <h2>鍵（GitHub トークン）</h2>
      <p class="muted" style="font-size:13px">工場のデータは非公開リポジトリにあります。読み書きするための鍵をここに入れます。鍵はこの端末の中だけに保存されます。</p>
      <div class="form">
        <label for="tok">トークン（GitHubで作った <code>github_pat_…</code> をコピーして貼り付け）</label>
        <div class="row" style="flex-wrap:nowrap">
          <input type="password" id="tok" autocomplete="off" spellcheck="false" placeholder="github_pat_… を貼り付け" value="${c.token ? "••••••••" : ""}" style="flex:1;min-width:0">
          <button type="button" class="btn" id="peek" aria-pressed="false">表示</button>
        </div>
        <label for="repo">リポジトリ</label>
        <input type="text" id="repo" autocomplete="off" spellcheck="false" value="${esc(c.repo)}">
        <div class="row">
          <button type="button" class="btn primary" id="save">保存して接続</button>
          <button type="button" class="btn" id="forget">鍵を消す</button>
        </div>
        <p class="state" id="set-state" aria-live="polite">${c.token ? "鍵は保存済みです" : "まだ鍵が入っていません"}</p>
      </div>
      <h2>鍵の作り方（一度だけ）</h2>
      <ol class="steps">
        <li>GitHub の Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token</li>
        <li>Repository access：<b>Only select repositories</b> で <code>booth-factory</code> だけを選ぶ</li>
        <li>Permissions → Repository permissions → <b>Contents：Read and write</b></li>
        <li>有効期限は好きな長さで（切れたらまた作って入れ直す）</li>
        <li>できたトークンをコピーして、上に貼って「保存して接続」</li>
      </ol>
      <p class="muted" style="font-size:12px">ホーム画面に追加したアプリと、ブラウザで開いたページは保存場所が別なので、それぞれで一度入れてください。</p>`;
    el.querySelector("#tok").addEventListener("focus", e => { if (e.target.value.startsWith("•")) e.target.value = ""; });
    el.querySelector("#peek").addEventListener("click", e => {
      const tok = el.querySelector("#tok"), show = tok.type === "password";
      tok.type = show ? "text" : "password";
      e.currentTarget.textContent = show ? "隠す" : "表示";
      e.currentTarget.setAttribute("aria-pressed", String(show));
    });
    el.querySelector("#save").addEventListener("click", async () => {
      const t = el.querySelector("#tok").value.trim(), r = el.querySelector("#repo").value.trim() || DEFAULT_REPO;
      const st = el.querySelector("#set-state");
      if (t && !t.startsWith("•") && !/^(github_pat_|ghp_|gho_)\w{20,}$/.test(t)) {
        st.textContent = "これは鍵の文字列ではないようです。トークンの名前ではなく、GitHubで作った直後に出る「github_pat_」で始まる長い文字列を貼ってください";
        return;
      }
      if (t && !t.startsWith("•")) store.set("gh_token", t);
      store.set("gh_repo", r);
      st.textContent = "接続を確かめています…";
      try { await api("data.json", { raw: true }); st.textContent = "つながりました"; imgCache.clear(); await refresh(); }
      catch (e) { st.textContent = errText(e); }
    });
    el.querySelector("#forget").addEventListener("click", () => { store.del("gh_token"); renderSettings(); });
  }

      <section class="help-sec" id="h-flow">

          ${arrow("朝7:00")}

          ${arrow()}

          ${arrow()}

          ${arrow()}
          <div class="fl-branch">
            <div class="ok"><b>OK</b>OK済みへ</div>
            <div class="fix"><b>直して</b>翌朝作り直して、また確認待ちに戻る</div>
            <div class="ng"><b>ボツ</b>ボツ置き場へ</div>
          </div>

          ${arrow("朝7:00")}
          ${step("⚙️", "工程C：仕上げ前処理", "見えない面の削除・余分な分割の整理・パーツ分け・テクスチャセット・UV・ハイポリ（角を丸めたベイク用）・FBX書き出しを仮でやる。余分な分割の整理＝ローポリの平らな面やまっすぐな辺の途中の点を消して割り直す（整えるときは分割が多めのまま触ってOK。細すぎる三角形や5角形以上の面は作らない）。写真やラベルを貼る大きい部品（商品見本・看板など）は専用のセット「Print」に分けて、UVを1枚まるごと使う")}
          ${arrow()}

          ${step("🔍", "テクスチャ確認待ち", "PCが5分以内にテクスチャを貼った3Dを作る。「テクスチャ込みの3Dで見る」で確かめて OK → Unityへ／塗り直す", true)}
          ${step("🧩", "Unity待ち", "工場が Unity に持ち込むフォルダ（FBX・テクスチャ）をそろえる。Unity のメニュー「Catalana → 工場から取り込む」で、マテリアルとプレハブ（単位ごと＋セット）まで自動でできる（<a href=\"#h-unity\">Unity</a>）。テクスチャを直したくなったら「塗り直す」でテクスチャ待ちへ戻せる。unitypackage を書き出したら「Unity完了 → 出品待ちへ」", true)}

      <section class="help-sec" id="h-example">
        <h3>コーンで見る工程ごとの変化</h3>
        <p class="muted" style="font-size:13px">カラーコーン2本＋コーンバー（Traffic_Cone）が、アイデアからテクスチャまで進んだ実際の記録です。</p>
        <ol class="ex-steps">
          <li><h4>① 工程A・B：ブロックアウト（10/21）</h4>${pic("guide/cone_1_blockout.jpg", "コーンのブロックアウトの4面図")}
            <p>工場が形・比率・部品の分け方だけを作った状態。部品ごとに色を変えてあるのは見分け用（あとでIDマップになる）。確認待ちで「直して」を3回：①頭を丸めて赤一色に・反射帯は形にしない（テクスチャで描く）・バーの継ぎ目をなくす ②実物の写真を見せて「台も赤いコーンの一部で、その上に黒い重し」に ③コーンの下に穴（あとで工程Cで中空にするため）。この時点で 1,556 tris（2本分）。</p></li>
          <li><h4>② OK済み：Blender で整える（10/22）</h4>${pic("guide/cone_2_tuned.jpg", "整えたコーン（ワイヤー付き）")}
            <p>OK を出した後、自分で .blend を開いて整え、「整えた」に「底を開けて中空に 厚み4ミリほど」とメモを付けて送った。工程Cへの注文はこのメモで伝える。</p></li>
          <li><h4>③ 工程C：見えない面を消す</h4>${pic("guide/cone_3_hidden.jpg", "消す面（赤）")}
            <p>赤＝部品に完全に埋まって見えない面（消す）。オレンジ＝一部だけ隠れる面（残す）。縞のバーの継ぎ目などが消える。重しやバーのように外せる部品は、当たり面を消さずに残す。</p></li>
          <li><h4>④ 工程C：ハイポリで丸める角</h4>${pic("guide/cone_4_bevel.jpg", "ハイポリで丸める角（オレンジ）")}
            <p>オレンジ＝ハイポリで丸める角（見やすいよう太く描いてある）。50°以上曲がった角だけを、部品の肉厚の8%で丸める。縞の境目のようにまっすぐつながる所は丸めない。</p></li>
          <li><h4>⑤ 工程C：ローポリとハイポリ</h4>${pic("guide/cone_6_lowhigh.jpg", "ローポリ（左）とハイポリ（右）")}
            <p>左＝ローポリ（ゲームで使う形。輪は16角形、バーは8角形、876 tris）。右＝ハイポリ（ベイク用。丸い部品は32角形にして角も丸めてある、6,308 tris）。ハイポリの細かさを法線マップに焼いて、ローポリをなめらかに見せる。余分な分割（台や重しの外周の点）もここでローポリだけ整理した。</p></li>
          <li><h4>⑥ 工程C：UV（テクスチャセット Main 1枚）</h4>${pic("guide/cone_5_uv.jpg", "UV展開図")}
            <p>コーン・重し・バーを1枚のテクスチャに詰めてある。2本目のコーンは同じ形なので作らず、1本分だけ（Unity で並べる）。長いバーは途中で切って島を細長くしすぎない。</p></li>
          <li><h4>⑦ テクスチャ（Substance Painter・10/24）</h4>${pic("guide/cone_7_textured.jpg", "テクスチャを貼ったコーン")}
            <p>バーを離したベイク用の FBX で焼いて、全部入りのローポリで塗った。書き出し（BaseMap・Normal・Occlusion・MetallicSmoothness）→「テクスチャ完了」→ アプリでテクスチャ込みの3Dを確認 → OK で Unity待ちへ。途中でバーの縞を10本→9本（両端を黒）に変えた。</p></li>
          <li><h4>⑧ Unity（10/27〜）</h4>
            <p>工場が単位ごとの FBX（Cone・Bar）とテクスチャ4枚を <code>Unity/Traffic_Cone/</code> にそろえ、Unity の「Catalana → 工場から取り込む」で、マテリアル1つとプレハブ3つ（Traffic_Cone_Cone・Traffic_Cone_Bar・2本＋バーを並べた Traffic_Cone_Set）が自動でできる。あとは見た目を確かめて unitypackage に書き出す（<a href="#h-unity">Unity</a>）。</p></li>
        </ol>
      </section>

      <section class="help-sec" id="h-card">
        <h3>カードの見方</h3>
        ${data ? `<div class="anno">
          ${pic("guide/cone_1_blockout.jpg", "コーンの4面図")}
          <span class="tag" style="left:2%;top:2%">正面</span><span class="tag" style="left:52%;top:2%">左側面</span>
          <span class="tag" style="left:2%;top:52%">上面</span><span class="tag" style="left:52%;top:52%">パース</span>
        </div>
        <p class="muted" style="font-size:12px">例：カラーコーン2本＋コーンバー（ブロックアウト。<a href="#h-example">コーンで見る工程</a>の①と同じ）</p>` : '<p class="muted">（データを読み込むと、ここに4面図の例が出ます）</p>'}
        <p><b>4面図</b>：正面・左側面・上面・パース（斜めから）の4方向。形と比率をここで見ます。ガラスは半透明で描くので、後ろの部品も見えます。<b>4面図を押すと3D</b>が開きます（右下の「タップで3D」）。</p>
        <p style="font-size:14px"><b>確認タブの一番上</b>：今やることの件数（黄色＝あなたの番：確認待ち・C確認・整え待ち・テクスチャ確認／白＝それ以外：直し待ち・塗り待ち・Unity待ち）と、テーマの進み具合（作ったもの / アイデアの数）。マスを押すとその段の一覧へ。</p>
        <div class="chips">
          <span class="chip ok">ポリ 476 / 6,000</span><span class="chip ok">浮きなし</span><span class="chip plain">マテリアル 6</span>
        </div>
        <ul style="font-size:14px">
          <li><b>ポリ</b>：三角形の数 / 予算。予算はサイズで決まる（1m未満 1,500、2.5m未満 3,000、それ以上 6,000）。超えると赤</li>
          <li><b>浮き</b>：どこにもくっついていない部品の数。0 が正解。あると赤</li>
          <li><b>マテリアル</b>：部品の色分けの数。工程Cで ColorID（Substance の ID マップ用）になるだけで、最終的なマテリアル数ではない。多くても問題なし。最終的には工程Cで 1〜2 個＋ガラス・光るものなどに分ける</li>
          <li><b>見てほしい点</b>（たためる）：工程Bが「ここは判断してほしい」と書いたこと。確認待ちでは最初から開いている</li>
          <li><b>直す前と比べる</b>（たためる）：作り直したものは、前の版の4面図と今の4面図を重ねて、スライダーで境目を動かして見比べられる（左＝前、右＝今）</li>
          <li><b>工程Bで直したこと</b>（たためる）：検品で自動で直したこと</li>
          <li><b>歩み</b>（たためる）：工場が作った日・送った返事・作り直し・工程C を日付順に</li>
          <li><b>ファイルの場所</b>（カードの一番下）：PCで開く .blend のパス。PCのブラウザなら「コピー」で貼り付けられる。工程Cの後は _prep の .blend。いつも開くなら PC の <code>_作業台</code> フォルダのほうが早い（<a href="#h-faq">よくある質問</a>）</li>
          <li><b>3Dで回して見る</b>：押すと全画面で3Dが開く。1本指で回転、ピンチでズーム、2本指で移動。「ワイヤー」は押すたびに なし → 三角 → 四角 と切り替わる（三角＝GPU・Unityが実際に描く三角形、四角＝Blender で見えるのと同じ辺）。「視点を戻す」で最初の向きに。閉じるはスマホの「戻る」でもOK。4面図では見えない裏側や隙間の確認に。工程C確認待ちのカードでは、自分で整えた .blend の形が出る（工程Cの仮の結果ではない）。ボツのものには出ない。テクスチャ確認待ち・Unity待ちのカードには<b>テクスチャ込みの3Dで見る</b>もある（ローポリにテクスチャを貼った形。セットの2つ目以降も並べて表示）</li>
          <li><b>UV</b>（たためる）：<b>展開図</b>（UVの切り開き方）と<b>チェッカー</b>（市松模様を貼った絵。ゆがんでいなければ OK）。工程Cの後は、テクスチャセットごとの展開図が見られる（工程C確認待ちのカード・テクスチャ待ちの一覧）。Print で始まるセットは写真・ラベル用で、上向きのまま並ぶ</li>
        </ul>
      </section>

      <section class="help-sec" id="h-reply">
        <h3>返事のしかた</h3>
        <div class="decide demo-btns" aria-hidden="true" style="border-top:0;padding-top:0">
          <div class="btns"><button type="button" class="act-ok" tabindex="-1">OK</button><button type="button" class="act-fix" tabindex="-1">直して</button><button type="button" class="act-reject" tabindex="-1">ボツ</button></div>
        </div>
        <ul style="font-size:14px">
          <li><b>OK</b>：このままで良い。OK済みに進む</li>
          <li><b>直して</b>：押すとメモ欄が開く。直してほしいことを書いて「送る」。メモ欄の下の<b>よく使う言い回し</b>（「もう少し太く」「高さを◯cmに」など）を押すと足せる（◯ は選んだ状態になるので、そのまま数字を打てる）。<b>写真を追加</b>で参考写真やスクショも付けられる（4枚まで）</li>
          <li><b>ボツ</b>：作らない。ボツ置き場へ</li>
        </ul>
        <div class="sent" aria-hidden="true"><p>送信済み：直して「支柱をもう少し太く」 → 5分以内に振り分け</p><button type="button" class="btn" tabindex="-1" style="pointer-events:none">取り消す</button></div>
        <p style="font-size:14px">送るとこの表示に変わります。PCが受け取るまで（5分以内）は<b>取り消す</b>で取り消せます。受け取られると、カードは直し待ち・OK済みなどの段に移ります。作り直しは翌朝7時か、送った後に出る「今すぐ直す」で。</p>
        <p style="font-size:14px"><b>直してのメモのコツ</b>：「どこを」「どうしたい」を具体的に。例：「ベンチの後ろ脚は座面の高さから真っすぐ下に」「全高を 8m に」。寸法や写真があると一発で直りやすいです。</p>
        <div class="decide demo-btns" aria-hidden="true" style="border-top:0;padding-top:0">
          <div class="btns one"><button type="button" class="act-prep" tabindex="-1">整えた → 工程Cへ</button></div>
        </div>
        <p style="font-size:14px"><b>あとから戻す</b>：OKを出した後でも戻せます。<b>OK済み</b>のカードの「直して」で作り直しに戻る（Blenderで整えた .blend は、作り直す前にアイテムのフォルダの <code>_backup</code> に保存されます）。<b>工程C確認待ち</b>は「整え直す」、<b>テクスチャ待ち</b>は「整え直す」で、もう一度Blenderで整えられる（工程Cは元の .blend を書き換えないので、整えた形はそのまま残っている）。<b>テクスチャ確認待ち</b>と<b>Unity待ち</b>は「塗り直す」でテクスチャ待ちに戻せる（フォルダごと＝.spp・テクスチャ・FBX も戻る）。<b>ボツ</b>は「確認待ちに戻す」で復活。どれもラインタブの数字のマスから一覧を開くと押せます。</p>
        <p style="font-size:14px"><b>整えた</b>（OK済みのもの）：Blender で整え終わったら押す。メモ欄に「扉はギミックにしたい」「UVはそのまま」「ビスも丸めて」など工程Cへの指示を書けます（なくてもOK）。ローポリのベベルは、入れたい所だけ自分で入れて<b>適用してから</b>押す（モディファイアのままだと工程Cで外れる）。</p>
      </section>

      <section class="help-sec" id="h-tex">
        <h3>テクスチャ（Substance Painter）</h3>
        <p style="font-size:14px"><b>使うファイル</b>（アイテムのフォルダの <code>_prep</code>）：</p>
        <ul style="font-size:14px">
          <li><b>塗る</b>：<code>名前_low.fbx</code>（全部入り）。セットの2つ目以降（コーンの2本目など）は入っていない（Unity で並べる）</li>
          <li><b>ベイク</b>：<code>名前_bake_low.fbx</code>／<code>名前_bake_high.fbx</code> があればそちら（触れ合う別の単位＝バーなどを離してあり、相手の形や影が焼き込まれない）。無ければ <code>名前_low</code>／<code>名前_high</code>。UV は全部同じ</li>
          <li>ベイクした後、<b>Edit → Project Configuration</b> の Mesh で <code>名前_low.fbx</code> に差し替えると、組み上がった形で塗れる（UV が同じなのでベイクしたマップはそのまま。位置を使うジェネレーターだけ、離した単位は少しずれる）</li>
          <li><code>名前_単位_low/high.fbx</code>（Cone・Bar など）は Unity のプレハブ用。塗るのには使わない</li>
        </ul>
        <p style="font-size:14px"><b>保存先</b>：プロジェクト（<code>名前.spp</code>）は <code>Substance/</code>、書き出しは <code>Textures/</code>（テクスチャ待ちに移るとき工場が作る）。プロジェクトはアイテム名で保存する（書き出しのファイル名に使われる）。</p>
        <p style="font-size:14px"><b>書き出し</b>（File → Export Textures）：テンプレートは「Unity Universal Render Pipeline (Metallic Standard)」を複製して、出力マップを次の4つにした物（この Substance にはビルトイン用がなく、URP の Metallic は Unity の Standard と同じ詰め方）。ファイル名は <code>$project_$textureSet_〜</code>。png・8ビット・1024（細かさが足りなければ 2048）・パディング「テクスチャの境界線まで」。</p>
        <table class="stage-tbl">
          <tr><th>BaseMap</th><td>RGB＝<b>Base color</b>（Diffuse ではない。Diffuse は金属の所が黒くなる）、A＝Opacity</td></tr>
          <tr><th>Normal</th><td>RGB＝Normal OpenGL</td></tr>
          <tr><th>Occlusion</th><td>Ambient occlusion（Mixed AO でも可）</td></tr>
          <tr><th>MetallicSmoothness</th><td>RGB＝Metallic、A＝「変換されたマップ」の <b>Glossiness</b>（チャンネルの Glossiness だと全面同じ値になる。Glossiness² は別物）</td></tr>
        </table>
        <p style="font-size:14px">光る部分がある物（灯り・照明）だけ Emissive を足す。Unity では Standard マテリアルの Albedo・Metallic・Normal Map・Occlusion・Emission に入る（取り込みスクリプトが自動でやる。<a href="#h-unity">Unity</a>）。1つのマテリアルを単位ごとの FBX に共通で使う。</p>
        <p style="font-size:14px"><b>塗り終えたら</b>：テクスチャ待ちのカードの「テクスチャ完了 → 確認へ」→ 5分以内にテクスチャ確認待ちへ移って、テクスチャ込みの3Dが見られる → OK → Unityへ／塗り直す。カードに「前の書き出しのまま」（一緒に書き出したはずの物が古い＝テンプレートから抜けている）や「金属の所の色が真っ黒」（BaseMap に Diffuse が入っている）と出たら、書き出しを見直す。</p>
        <p style="font-size:14px"><b>注意</b>：塗り始めたら工程Cは作り直さない（作り直すと形が同じでも UV の配置が変わって、焼き直しになる）。段を移るとフォルダごと動くので、Substance の「最近使ったプロジェクト」は古い場所を指す（今の場所の <code>Substance/</code> から開く）。</p>
      </section>

      <section class="help-sec" id="h-unity">
        <h3>Unity（プレハブと unitypackage）</h3>
        <p style="font-size:14px">Unity待ちになると、工場がアイテムのフォルダの <code>Unity\\名前\\</code> に、Unity に持ち込む物をそろえます（アプリの反映のたび。Claude は使わない）。マテリアルとプレハブは Unity の中でしか正しく作れない（中のIDでつながっている）ので、Unity 側の小さなスクリプトが作ります。対象は <b>Unity 2022.3・ビルトイン（Standard シェーダー）</b>＝VRChat と同じ。</p>
        <p style="font-size:14px"><b>出品用のプロジェクト</b>：<code>C:\\Users\\y.togawa\\UnityProjects\\Catalana_Publish</code>（Unity 2022.3.22f1・ビルトイン。取り込みスクリプト入り）。最初に Unity Hub の「追加 → ディスクから追加」でこのフォルダを選ぶ。単品もパックも、いつもこのプロジェクトから書き出す。<code>アセット確認</code>（Unity 6・URP）は見た目の確認用なので、出品には使わない。</p>
        <p style="font-size:14px">取り込みスクリプトの元は <code>_factory\\unity\\CatalanaFactoryImporter.cs</code>（別のプロジェクトで使うなら <code>Assets/CatalanaTools/Editor/</code> に入れる。商品フォルダ CatalanaAssets の外なので unitypackage には入らない）。工場の場所は <code>G:\\マイドライブ\\booth\\products\\_factory\\70_unity</code> が最初から入っている（違うときは「Catalana → 工場の場所を変える」）。</p>
        <p style="font-size:14px"><b>毎回の流れ</b>：</p>
        <ol style="font-size:14px">
          <li>Unity で <b>Catalana → 工場から取り込む</b>。Unity待ちの物が全部 <code>Assets/CatalanaAssets/StreetPack/名前/</code> に入り、そのまま組み立てまで終わる（フォルダを Project 窓にドラッグして入れても、入れた時点で自動で組み立てる）</li>
          <li>Prefabs のプレハブをシーンに置いて見た目を確かめる。直したい所はプレハブを直接直してよい（次に取り込んでも、あるプレハブとマテリアルは上書きしない）</li>
          <li>書き出し：単品は <code>StreetPack/名前</code> フォルダ、パックは <code>StreetPack</code> フォルダを選んで <b>Catalana → 選んだフォルダを unitypackage に書き出す</b>。保存画面は工場の外の売り物の置き場で開く：単品は <code>products\\StreetPack\\名前\\</code>、パックは <code>products\\StreetPack\\</code>（今までの LockerPack などと同じ並び。工場のフォルダは品物と一緒に動いたり作り直されたりするので置かない）。名前は <code>名前_v1.0.unitypackage</code>、前の版があれば次の版（v1.1 など）が最初から入っている。工場の設計図（<code>.factory_item.json</code>）は Unity に取り込まれないので、商品には入らない</li>
          <li>アプリのカードで <b>Unity完了 → 出品待ちへ</b>。出品待ちに移った物は、工場から取り込むの対象から外れる（版を上げるときは出品待ち・出品済みの「Unityに戻す」で戻す）</li>
        </ol>
        <p style="font-size:14px"><b>Unity の中の形</b>（アイテムごとに1フォルダ）：</p>
        <pre style="font-size:12px;overflow-x:auto">Assets/CatalanaAssets/StreetPack/
  Traffic_Cone/
    FBX/        Traffic_Cone_Cone.fbx, Traffic_Cone_Bar.fbx
    Textures/   _BaseMap, _Normal, _Occlusion, _MetallicSmoothness
    Materials/  Traffic_Cone_Main.mat
    Prefabs/    Traffic_Cone_Cone, Traffic_Cone_Bar, Traffic_Cone_Set
  Bus_Stop/
    …</pre>
        <p style="font-size:14px"><b>単品とパック</b>：単品もパックも同じ場所・同じ中身なので、単品を買った人が後からパックを入れても、同じファイルが上書きされるだけで二重にならない（同じ Unity プロジェクトから書き出すこと。別のプロジェクトだと中のIDが変わって二重になる）。</p>
        <p style="font-size:14px"><b>スクリプトがやること</b>：</p>
        <ul style="font-size:14px">
          <li>テクスチャの設定：Normal＝法線マップ、Occlusion・MetallicSmoothness＝sRGB オフ（色ではなく数値として読む）</li>
          <li>FBX の設定：カメラ・ライト・アニメなし。マテリアルを工場のマテリアルに差し替え</li>
          <li>マテリアル：Standard。Albedo＝BaseMap、Metallic＝MetallicSmoothness（なめらかさは A）、Normal Map、Occlusion（光る物は Emission、名前に Glass が付くセットは半透明）</li>
          <li>プレハブ：販売単位ごと（外せる付属は子）。一番上は回転なしの入れ物なので、置いたとき回転が (0,0,0)。当たり判定（MeshCollider）付き</li>
          <li>セットのプレハブ（名前_Set）：単位のプレハブを入れ子で並べる。単位を直せばセットも直る</li>
        </ul>
        <p style="font-size:14px"><b>作り直したいとき</b>：Project 窓でアイテムのフォルダを選んで <b>Catalana → 選んだフォルダを作り直す（プレハブも）</b>。手で直した所は消える。テクスチャを塗り直したときは、作り直さなくても「工場から取り込む」だけで新しい絵に変わる。</p>
      </section>

        <p style="font-size:14px">朝7時を待たずに、工場をその場で動かせます。<b>ライン</b>タブの一番上にあります。</p>
