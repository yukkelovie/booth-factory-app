      <section class="help-sec" id="h-faq">
        <h3>よくある質問</h3>
        <dl class="faq">
          <dt>押したのに何も変わらない</dt><dd>PCが5分おきに受け取りに来ます。それまではカードが「送信済み」になっていれば大丈夫です。PCがスリープ中なら、朝7時にまとめて受け取ります。作り直しまで急ぎたいときは「今すぐ直す」などを押してください。</dd>
          <dt>「今すぐ」を押したのに始まらない</dt><dd>PCがスリープ中か、電源が切れています。PCが起きれば5分以内に始まります。朝のラインが動いている最中なら、それが終わってから始まります。</dd>
          <dt>最新の状態にしたい</dt><dd>右上の ↻ を押してください。工場の状況は、毎朝のラインの後に更新されます。</dd>
          <dt>「鍵が無効です」と出る</dt><dd>トークンの期限切れか、消してしまった可能性があります。GitHub で作り直して、設定タブで貼り直してください。</dd>
          <dt>PC でも見たい</dt><dd>同じ URL を開いて、PC 用のトークンを設定タブに貼れば見られます。データは共通です。</dd>
          <dt>「書き込みの権限がありません」と出る</dt><dd>鍵が「読むだけ」で作られています。GitHub の Fine-grained tokens でその鍵を開いて Edit → Contents を Read and write にして Update。鍵の貼り直しはいりません。</dd>
          <dt>スマホを無くした</dt><dd>GitHub の Settings → Developer settings → Fine-grained tokens で、スマホ用のトークンを Delete してください。</dd>
          <dt>ハイポリの角の丸め方を変えたい</dt><dd>工程Cは、部品ごとに50°以上曲がった角（八角形の丸棒の45°は丸めない）を、部品の肉厚の8%（1〜8mm）の幅で丸めます。全体が3cm未満の小物（ビス頭など）は丸めません。同じグループ（ひとつの組み立て）で触れ合っている部品（脚とレール、縞のバーなど）は1つにつなげてから丸めるので、継ぎ目に溝や段はできません。違う部品との境目（埋まっている面の辺、部品が乗っている辺）も丸めません（境目を丸めると、法線マップに溝の線が出るため）。地面に接する辺は、ポール・街灯のように<b>地面に固定</b>されている物は丸めず、ベンチ・自販機のように<b>置いてある</b>物は丸めます（どちらかはカードのチップに出ます。違っていたら「直して」のメモで「これは固定」「これは置いてある」と書いてください）。工程C確認待ちのカードの「ハイポリで丸める角」で、オレンジの所が丸まります。<br>変えたいときは2通り：①Blenderで整えるとき、丸めたい辺にだけ<b>ベベルウェイト</b>を付ける（編集モードで辺を選んで、サイドバー［N］の「アイテム」タブにあるベベルウェイト、または 辺メニュー →「辺のベベルウェイト」）。印を付けた部品は、印の辺だけ丸まる（1.0＝ふつうの幅、0.5＝半分）。②「整えた」や「直して」のメモに「ビスも丸めて」「扉は丸めないで」「全体に丸みを強く」などと書く。</dd>
          <dt>同じ物を並べたセット（コーン2本＋バーなど）は？</dt><dd>工程Cが「販売単位」に分けます。同じ形の2つ目以降は作らず1つ分だけ作り、単位ごとにFBX（ピボットが原点、外せる付属は子オブジェクト）を書き出します。セットは Unity の取り込みスクリプトが、単位のプレハブを並べた入れ子のプレハブ（名前_Set）として自動で組みます（並べる位置は工程C確認待ちのカードの「セットの並べ方」と同じ）。単位のプレハブを1つ直せばセットも直ります。</dd>
          <dt>消す面や丸める角を3Dで見たい</dt><dd>工程C確認待ちのカードの「3Dで確認（消す面／丸める角／ローポリ／ハイポリ）」を押すと、上のボタンで4つを切り替えて回して見られます。カードの「消す面」「丸める角」「パーツ分け」（＝ローポリ）の画像を押しても、それぞれの層で開きます。<b>消す面</b>：赤＝消す、オレンジ＝一部だけ隠れる（残す）、半透明＝残す。<b>丸める角</b>：オレンジ＝ハイポリで丸める角（太めに描いてある）。<b>ローポリ</b>：実際に使う形（消す面を消してスムーズをかけた後）。<b>ハイポリ</b>：ベイク用。画像では見えにくい底や内側（重しの底面、コーンの中など）の確認に。下の「ワイヤー」は どの層でも なし → 三角 → 四角 と切り替わり、層を切り替えると線もその層の形に変わります（四角＝Blender の辺。ローポリ・ハイポリの割り方の確認に）。</dd>
          <dt>重しや蓋など、取り外せる部品は？</dt><dd>載せてある・はめてあるだけで外せる部品（コーンの重し・コーンバー、蓋、置き物など）は、工程Cが「取り外せる部品」として扱うと、ほかの部品と当たっている面を消さずに残し、そこの角も丸めます（外したときに見えるため）。工程Cが判断できないこともあるので、「整えた」のメモに「重しとバーは取り外せる部品」のように書いておくと確実です。</dd>
          <dt>縞のバーみたいに色の境目がある物は？</dt><dd>ローポリでは色の境目で分割しません（同じ断面でつないだ継ぎ目は頂点を1つにまとめて線を消す）。色はテクスチャで塗ります。黒と黄色などの色分けのマスク（ID マップ）は、ハイポリには境目が残っているので、ハイポリの ColorID から焼けます。長い筒はUVが細長くなりすぎないよう、色とは関係ない所で何か所か切ってあります。</dd>
          <dt>ベンチの板みたいに長い部品で UV が余ったら？</dt><dd>工程Cの確認で「UV をもっと広く」と直しを出してください。工程Cが長い部品を等間隔で何か所か切って（シームを入れて）、島を短くして詰め直します。形は変わりません。切る本数を変えたいときは「3つに切って」のように書けばそのとおりにします。木目が切れ目でずれて見えるときは、Substance で木目をトライプラナーにすると目立ちません。</dd>
          <dt>ローポリのスムーズは？</dt><dd>工程Cが、全部の面をスムーズにして50°以上曲がった辺だけ角にする「自動スムーズ」をかけ直します。整えるときにスムーズが外れても大丈夫です。触ってほしくないときはメモに「スムーズはそのまま」と書いてください。</dd>
          <dt>コーンやバケツみたいに中が空洞の物は？</dt><dd>ブロックアウトでは中身の詰まった形で作り、工程Cで口を開けて内側に厚み（コーンなら4mm）を付けます。UVは内側にも外側と同じ密度で取るので、そのぶん各島は小さくなります。開けたい部品や向き（底・上）は「整えた」のメモで指定できます（例：「コーンの底を開けて中空に」）。下から中を見せたいときは、台など下にある部品にも穴が必要です。</dd>
          <dt>Blender のアセットブラウザで使いたい</dt><dd>工場のアイテムは全部 <code>G:\\マイドライブ\\booth\\products\\_factory\\_asset_library</code> にアセットとして入っています（ボツ以外）。<code>G:\\マイドライブ\\booth</code> をアセットライブラリに登録してあれば、そのままアセットブラウザに「3Dアセット工場」の分類（確認待ち・OK済み…）で出ます（分類の定義は booth の一番上の blender_assets.cats.txt に工場が書きます。自分で作った分類の行は消しません）。工程が進むと中身も分類も自動で更新されます（工程Cの後はローポリの形）。シーンに置くときに読み込み方法を「リンク」にしておくと、ライブラリが更新されたときに置いた物も新しくなります（「アペンド」だと置いた時点の形のまま）。</dd>
          <dt>どのファイルを開けばいいかわからない</dt><dd>PCの <code>G:\\マイドライブ\\booth\\products\\_factory\\_作業台</code> を開いてください。あなたの出番のもの（1【整える】＝OK済み、2【C確認】＝工程Cの結果、3【塗る】＝テクスチャ待ち、4【Unity】＝Unity待ち）の .blend へのショートカットが並んでいて、ダブルクリックで Blender が開きます。アプリが更新されるたびに作り直されるので、終わったものは自動で消えます。エクスプローラーのクイックアクセスにピン留めしておくと便利です。カードの一番下にもファイルの場所が出ていて、PCのブラウザなら「コピー」で Blender の「開く」やエクスプローラーのアドレス欄に貼れます。</dd>
          <dt>部品のめり込みは？</dt><dd>部品は面と面でぴったり突き合わせるのが決まりです（めり込みは見た目が汚く、工程Cの面の削除やベイクでゴミ面の原因になる）。ただし<b>丸い面（円柱・丸棒の側面）に付く・横から生える部品</b>（ポールから出るアーム、ポールに貼るプレートなど）は、平らな端を丸い面に合わせられないので少しの入り込みはOK（突き抜けはNG）。ポールより太い円柱を重ねた帯・キャップや、平らな面どうしの重なりは直します。実物どおり差し込む作り（基礎に埋まるポール・台座を貫くボルト）も OK。</dd>
          <dt>ハイポリの丸い部品は？</dt><dd>工程Cが、ローポリの円柱（12角形など）をハイポリでは32角形前後に増やして本当の円柱にします（12→36、16→32、8→32）。部品ごとに増やしてからつなげるので、輪とバーのように食い込んだ所も漏れません。ぴったり重なる面でつながる部品（縞のバーの縞どうし）は溶接するので、継ぎ目は1本の線だけ（色の境目＝ID の境目として残る。丸めない）。</dd>
          <dt>アイデアを足したい・順番を変えたい</dt><dd>00_ideas\\ideas.md を直接書き換えるか、Claude のチャットで頼んでください。</dd>
        </dl>
      </section>`;
    hydrateImgs(el);
  }

  const noData = () => loadErr ? `<p class="banner err">${esc(loadErr)}</p>` : '<p class="muted">読み込み中…</p>';

  // ---------------------------------------------------------------- 返事（inbox/<Item>.json）
  const MAX_PHOTOS = 4;
  const pending = new Map();   // item -> [{blob, url}]（送る前の写真）

  async function toJpeg(file) {   // スマホ写真（HEIC含む）を長辺2000pxのJPEGに。変換できなければそのまま
    try {
      const bmp = await createImageBitmap(file);
      const s = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      return (await new Promise(r => c.toBlob(r, "image/jpeg", 0.85))) || file;
    } catch (e) { return file; }
  }

  function thumb(src, onRemove) {
    const li = document.createElement("li");
    li.innerHTML = `<img alt="添付写真">`;
    li.querySelector("img").src = src;
    if (onRemove) {
      const rm = document.createElement("button");
      rm.type = "button"; rm.className = "rm"; rm.textContent = "×"; rm.setAttribute("aria-label", "この写真を外す");
      rm.addEventListener("click", onRemove); li.append(rm);
    }
    return li;
  }

  function showState(b) {
    const d = inbox[b.dataset.item];
    const btns = b.querySelector(".btns"), fix = b.querySelector(".fixbox"), sent = b.querySelector(".sent");
    if (d) {
      btns.hidden = true; fix.hidden = true; sent.hidden = false;
      const n = (d.photos || []).length;
      sent.querySelector("p").textContent = "送信済み：" + (LABEL[d.action] || d.action) + (d.note ? "「" + d.note + "」" : "") + (n ? `（写真${n}枚）` : "") + " → 5分以内に振り分け";
      const now = sent.querySelector(".now"), mode = NOW_MODE[d.action];
      now.hidden = !mode;
      if (mode) { now.dataset.mode = mode; paintNow(now); }
    } else { btns.hidden = false; sent.hidden = true; }
  }

  // ---------------------------------------------------------------- 今すぐ動かす（requests/<mode>.json → PCの見張りが5分おきに拾う）
  const NOW_MODE = { fix: "fix", prep: "prep", prep_fix: "prep" };
  const STAGE_NOW = { "30_feedback": "fix", "50_prep": "prep", "80_release": "release" };   // 段の見出しの「今すぐ」
  const RUN_LABEL = { new: "新作", fix: "直し", prep: "工程C", release: "出品準備", morning: "朝のライン" };
  const NOW_TEXT = { fix: "今すぐ直す", prep: "今すぐ工程Cへ", release: "今すぐ出品準備" };
  let requests = {}, status = null, pollTimer = null, wasActive = false;

  function paintNow(btn) {
    const m = btn.dataset.mode;
    const busy = status && status.state === "running" && status.mode === m;
    btn.disabled = !!requests[m] || busy;
    btn.textContent = busy ? "実行中…" : requests[m] ? "依頼済み" : NOW_TEXT[m] || "今すぐ";
  }

  async function loadRequests() {
    requests = {}; status = null;
    try {
      const files = await (await api("requests")).json();
      files.filter(f => f.type === "file" && /^(new|fix|prep|release)\.json$/.test(f.name)).forEach(f => { requests[f.name.slice(0, -5)] = { sha: f.sha }; });
    } catch (e) { if (e.status !== 404) throw e; }
    try { status = await (await api("status.json", { raw: true })).json(); } catch (e) { if (e.status !== 404) throw e; }
  }

  async function requestRun(mode) {
    if (requests[mode]) return;
    const body = { message: `今すぐ（${RUN_LABEL[mode]}）`, content: b64utf8(JSON.stringify({ mode, at: new Date().toISOString() })) };
    const r = await (await api(`requests/${mode}.json`, { method: "PUT", body })).json();
    requests[mode] = { sha: r.content.sha };
    paintRun(); startPoll();
  }

  async function cancelRun(mode) {
    const q = requests[mode];
    if (!q) return;
    await api(`requests/${mode}.json`, { method: "DELETE", body: { message: `今すぐの取り消し（${RUN_LABEL[mode]}）`, sha: q.sha } });
    delete requests[mode];
    paintRun();
  }

  function runPanel() {
    if (!data) return "";
    const pend = act => Object.values(inbox).filter(d => act.includes(d.action)).length;
    const n = { new: data.todo.length, fix: byStage("30_feedback").length + pend(["fix"]), prep: byStage("50_prep").length + pend(["prep", "prep_fix"]),
      release: byStage("80_release").length + pend(["unity_done"]) };
    const running = status && status.state === "running";
    const line = running ? `<p class="banner">稼働中：${esc(RUN_LABEL[status.mode] || status.mode)}（${fmt(status.since)} から）</p>`
      : Object.keys(requests).length ? `<p class="banner">依頼済み：${Object.keys(requests).map(m => RUN_LABEL[m]).join("・")}。PCが起きていれば5分以内に始まります</p>`
      : `<p class="muted" style="font-size:13px">待機中${status && status.finished ? `（最後の実行 ${fmt(status.finished)}）` : ""}。PCがスリープ中なら、起きたときに始まります</p>`;
    const btn = (m, label, count, unit) => {
      const req = !!requests[m], busy = running && status.mode === m;
      return `<div class="row" style="align-items:center;justify-content:space-between">
        <span style="font-size:14px"><b>${label}</b> <span class="muted" style="font-size:12px">${count}${unit}</span></span>
        ${req && !busy ? `<button type="button" class="btn" data-cancel="${m}">依頼を取り消す</button>`
          : `<button type="button" class="btn primary" data-run="${m}" ${!count || busy ? "disabled" : ""}>${busy ? "実行中…" : "今すぐ"}</button>`}
      </div>`;
    };
    return `<section class="card" id="run-panel" aria-live="polite">
      <h3 style="font-size:17px">今すぐ動かす</h3>
      ${line}
      ${btn("new", "新作を1つ作る", n.new, " 件のアイデア")}
      ${btn("fix", "直しを反映する", n.fix, " 件")}
      ${btn("prep", "工程Cを動かす", n.prep, " 件")}
      ${btn("release", "出品準備（スクショ・説明文）", n.release, " 件")}
      <p class="state" id="run-state"></p>
    </section>`;
  }

  function paintRun() {
    const old = document.getElementById("run-panel");
    if (old) { old.outerHTML = runPanel(); wireRun(); }
    document.querySelectorAll(".sent .now:not([hidden]), .stage-now").forEach(paintNow);
  }

  function wireRun() {
    const p = document.getElementById("run-panel");
    if (!p) return;
    const st = t => { const s = document.getElementById("run-state"); if (s) s.textContent = t; };
    p.querySelectorAll("[data-run]").forEach(b => b.addEventListener("click", async () => {
      b.disabled = true; st("依頼中…");
      try { await requestRun(b.dataset.run); } catch (e) { st(errText(e)); b.disabled = false; }
    }));
    p.querySelectorAll("[data-cancel]").forEach(b => b.addEventListener("click", async () => {
      b.disabled = true; st("取り消し中…");
      try { await cancelRun(b.dataset.cancel); } catch (e) { st(e.status === 404 || e.status === 409 ? "もうPCが受け付けたので取り消せません" : errText(e)); await loadRequests().catch(() => {}); paintRun(); }
    }));
  }

  const active = () => Object.keys(requests).length > 0 || (status && status.state === "running");
  function startPoll() {
    wasActive = wasActive || active();
    if (pollTimer || !active()) return;
    pollTimer = setInterval(async () => {
      try { await loadRequests(); } catch (e) { return; }
      if (active()) { paintRun(); return; }
      clearInterval(pollTimer); pollTimer = null;
      const typing = [...document.querySelectorAll(".fixbox:not([hidden]) textarea")].some(t => t.value.trim());
      if (wasActive && !typing) { wasActive = false; refresh(); } else paintRun();
    }, 20000);
  }

  function wireDecide(root) {
    root.querySelectorAll(".decide").forEach(b => {
      const item = b.dataset.item, mode = MODES[b.dataset.mode];
      const setState = t => { b.querySelector(".state").textContent = t; };
      const enable = on => b.querySelectorAll("button").forEach(x => { x.disabled = !on; });
      if (!pending.has(item)) pending.set(item, []);
      const ul = b.querySelector(".fixbox .thumbs"), input = b.querySelector('input[type="file"]');
      const draw = () => ul.replaceChildren(...pending.get(item).map(p => thumb(p.url, () => {
        URL.revokeObjectURL(p.url); pending.set(item, pending.get(item).filter(x => x !== p)); draw();
      })));
      draw();
      showState(b);

      b.querySelectorAll(".btns button").forEach(btn => btn.addEventListener("click", () => {
        const act = btn.dataset.act;
        if (mode.note[act]) {
          b.dataset.pending = act;
          const f = b.querySelector(".fixbox");
          f.querySelector("label").textContent = mode.note[act][0];
          f.querySelector("textarea").placeholder = mode.note[act][1];
          f.querySelector(".tpl").innerHTML = (TEMPLATES[act] || []).map(t => `<button type="button" class="chip-btn">${esc(t)}</button>`).join("");
          f.hidden = !f.hidden; if (!f.hidden) f.querySelector("textarea").focus();
          return;
        }
        send(act, "");
      }));
      b.querySelector(".tpl").addEventListener("click", e => {
        const c = e.target.closest(".chip-btn");
        if (!c) return;
        const ta = b.querySelector("textarea"), t = c.textContent, v = ta.value.trimEnd();
        ta.value = v ? v + (/[。、！？]$/.test(v) ? "" : "。") + t : t;
        ta.focus();
        const q = ta.value.lastIndexOf("◯");
        if (q >= ta.value.length - t.length) ta.setSelectionRange(q, q + 1); else ta.setSelectionRange(ta.value.length, ta.value.length);
      });
      b.querySelector(".add-photo").addEventListener("click", () => input.click());
      input.addEventListener("change", async () => {
        const files = [...input.files].slice(0, MAX_PHOTOS - pending.get(item).length);
        input.value = "";
        for (const f of files) { const blob = await toJpeg(f); pending.get(item).push({ blob, url: URL.createObjectURL(blob) }); }
        draw();
        setState(pending.get(item).length >= MAX_PHOTOS ? "写真は4枚までです" : "");
      });
      b.querySelector(".send").addEventListener("click", () => {
        const act = b.dataset.pending, note = b.querySelector("textarea").value.trim();
        if (NOTE_REQUIRED.includes(act) && !note) { setState("直してほしいことを一言書いてください"); b.querySelector("textarea").focus(); return; }
        send(act, note);
      });
      b.querySelector(".now").addEventListener("click", async e => {
        const btn = e.currentTarget;
        btn.disabled = true; setState("依頼中…");
        try { await requestRun(btn.dataset.mode); setState("PCが起きていれば5分以内に始まります。ラインタブで様子が見られます"); }
        catch (err) { setState(errText(err)); btn.disabled = false; }
      });
      b.querySelector(".undo").addEventListener("click", async () => {
        const d = inbox[item];
        if (!d) return;
        enable(false); setState("取り消し中…");
        try {
          await api(`inbox/${item}.json`, { method: "DELETE", body: { message: `取り消し ${item}`, sha: d._sha } });
          for (const p of d.photos || []) {
            try { const r = await (await api(p)).json(); await api(p, { method: "DELETE", body: { message: `写真の取り消し ${item}`, sha: r.sha } }); } catch (e) {}
          }
          delete inbox[item]; setState(""); showState(b); renderLog(); paintRun();
        } catch (e) { setState(errText(e)); } finally { enable(true); }
      });

      async function send(action, note) {
        enable(false); setState("送信中…");
        try {
          const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15);
          const photos = [];
          if (mode.note[action]) {
            let i = 0;
            for (const p of pending.get(item)) {
              i++; setState(`写真を送信中…（${i}/${pending.get(item).length}）`);
              const path = `inbox/photos/${item}_${stamp}_${i}.jpg`;
              await api(path, { method: "PUT", body: { message: `写真 ${item}`, content: await blobB64(p.blob) } });
              photos.push(path);
            }
          }
          const doc = { item, action, note, photos, at: new Date().toISOString() };
          const body = { message: `${LABEL[action]} ${item}`, content: b64utf8(JSON.stringify(doc, null, 1)) };
          if (inbox[item]) body.sha = inbox[item]._sha;
          const r = await (await api(`inbox/${item}.json`, { method: "PUT", body })).json();
          inbox[item] = { ...doc, _sha: r.content.sha };
          pending.get(item).forEach(p => URL.revokeObjectURL(p.url)); pending.set(item, []);
          draw(); b.querySelector("textarea").value = "";
          setState(""); showState(b); renderLog(); paintRun();
        } catch (e) { setState(errText(e)); }
        finally { enable(true); }
      }
    });
  }

  // ---------------------------------------------------------------- 読み込み
  async function loadInbox() {
    inbox = {};
    let files = [];
    try { files = await (await api("inbox")).json(); } catch (e) { if (e.status !== 404) throw e; }
    await Promise.all(files.filter(f => f.type === "file" && f.name.endsWith(".json")).map(async f => {
      try { const d = await (await api(f.path, { raw: true })).json(); inbox[d.item || f.name.slice(0, -5)] = { ...d, _sha: f.sha }; } catch (e) {}
    }));
  }

  // ---------------------------------------------------------------- 工程ごとの一覧（ラインの数字・サムネから開く）
  const STAGE_INFO = {
    todo: { label: "待ち行列", hint: "まだ作っていないアイデア。上から順に作ります" },
    "10_blockout": { label: "工程A済み", hint: "形ができて、工程Bの検品待ち" },
    "20_ready": { label: "確認待ち", hint: "4面図を見て OK／直して／ボツ", mode: "review" },
    "30_feedback": { label: "直し待ち", hint: "次のライン（または「今すぐ直す」）で作り直します" },
    "40_approved": { label: "OK済み", hint: "Blenderで整えたら「整えた」を押すと、工程Cが仕上げ前処理をします。形から作り直したいときは「直して」", mode: "prep" },
    "50_prep": { label: "工程C待ち", hint: "次のライン（または「今すぐ」）で工程Cが仕上げ前処理をします" },
    "55_prep_review": { label: "工程C確認待ち", hint: "消す面とパーツ分けを確認して OK（確定）／直して。Blenderで整え直したいときは「整え直す」" },
    "60_texturing": { label: "テクスチャ待ち", hint: "_prep フォルダの FBX を Substance Painter へ（塗るのは「名前_low.fbx」、ベイクは bake があればそちら。.spp は Substance/、書き出しは Textures/ へ）。塗り終えて Textures/ に書き出したら「テクスチャ完了」。もう一度整えたいときは「整え直す」", mode: "texturing" },
    "65_texture_review": { label: "テクスチャ確認待ち", hint: "「テクスチャ込みの3Dで見る」で確かめて、OK なら Unity 待ちへ。直すなら「塗り直す」", mode: "tex_review" },
    "70_unity": { label: "Unity待ち", hint: "Unity で「Catalana → 工場から取り込む」→ 見た目を確かめて unitypackage に書き出したら「Unity完了」で出品待ちへ。テクスチャを直したいときは「塗り直す」でテクスチャ待ちへ（フォルダごと戻る）", mode: "unity" },
    "80_release": { label: "出品待ち", hint: "朝7:00のライン（または「今すぐ出品準備」）で、工場が Unity でスクショを撮り、BOOTH 説明文（日英）を書きます。サムネを作って BOOTH に出したら「出品した」。Unity でもう一度直すなら「Unityに戻す」", mode: "release" },
    "90_released": { label: "出品済み", hint: "BOOTH に出した物。版を上げる（v1.1 など）ときは「Unityに戻す」で Unity待ちへ", mode: "released" },
    "99_rejected": { label: "ボツ", hint: "作らないことにしたもの。やっぱり作るなら「確認待ちに戻す」", mode: "rejected" },
  };
  let curStage = null, prevTab = "line";

  function openStage(stage, item) {
    const shown = [...document.querySelectorAll("main")].find(m => !m.hidden);
    if (shown && shown.dataset.view !== "stage") prevTab = shown.dataset.view;
    curStage = stage;
    switchTab("stage");
    renderStage();
    if (item) {   // カルーセルの中のそのカードへ（横に送る）
      const t = document.querySelector(`#view-stage #item-${CSS.escape(item)}`);
      if (t) t.parentElement.scrollLeft = t.offsetLeft - t.parentElement.offsetLeft - 16;
    }
  }

  function renderStage() {
    const el = document.getElementById("view-stage");
    const info = STAGE_INFO[curStage];
    if (!info) { el.innerHTML = ""; return; }
    const head = n => `<div class="stage-head"><button type="button" class="btn back">← 戻る</button><h2>${info.label} <small>${n} ${curStage === "todo" ? "件" : "点"}</small></h2></div>
      <p class="muted hint" style="margin-top:0">${esc(info.hint)}</p>`;
    if (!data) { el.innerHTML = noData(); return; }
    if (curStage === "todo") {
      el.innerHTML = head(data.todo.length) +
        `<ul class="queue">${data.todo.map(t => `<li><span>${esc(t.name)}</span><code>${esc(t.code)}</code></li>`).join("") || "<li><span>待ち行列は空です</span></li>"}</ul>`;
    } else {
      const its = byStage(curStage);
      // 2点以上は横スワイプで次のカードへ（カルーセル）
      el.innerHTML = head(its.length) + (its.length
        ? `${its.length > 1 ? `<p class="swipe-hint" aria-live="polite"><span class="pos">1 / ${its.length}</span> ・ 横にスワイプで次へ</p>` : ""}
           <div class="carousel">${its.map(it => curStage === "55_prep_review" ? prepCard(it) : card(it, info.mode)).join("")}</div>`
        : '<p class="muted">ここには何もありません。</p>');
      const car = el.querySelector(".carousel"), pos = el.querySelector(".swipe-hint .pos");
      if (car && pos) car.addEventListener("scroll", () => {
        const step = car.firstElementChild ? car.firstElementChild.offsetWidth + 12 : car.clientWidth;
        pos.textContent = `${Math.min(its.length, Math.round(car.scrollLeft / step) + 1)} / ${its.length}`;
      }, { passive: true });
      wireDecide(el);
      hydrateImgs(el);
    }
    el.querySelector(".back").addEventListener("click", () => switchTab(prevTab || "line"));
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-open-stage]");
    if (b) openStage(b.dataset.openStage, b.dataset.openItem);
    const cp = e.target.closest(".copy-path");
    if (cp) {
      const done = t => { cp.textContent = t; setTimeout(() => { cp.textContent = "コピー"; }, 1500); };
      (navigator.clipboard ? navigator.clipboard.writeText(cp.dataset.path) : Promise.reject()).then(() => done("コピーした"), () => done("できません"));
    }
    const cd = e.target.closest(".copy-desc");
    if (cd && data) {
      const it = data.items.find(i => i.id === cd.dataset.item);
      const done = t => { cd.textContent = t; setTimeout(() => { cd.textContent = "コピー"; }, 1500); };
      (navigator.clipboard && it ? navigator.clipboard.writeText(it.release.desc) : Promise.reject()).then(() => done("コピーした"), () => done("できません"));
    }
    const v = e.target.closest("[data-v3d]");
    if (v && data) { const it = data.items.find(i => i.id === v.dataset.v3d); if (it && it.glb) open3d(it); }
    const vt = e.target.closest("[data-v3d-tex]");
    if (vt && data) { const it = data.items.find(i => i.id === vt.dataset.v3dTex); if (it && it.tex && it.tex.glb) open3d(it, false, true); }
    const vc = e.target.closest("[data-v3d-check]");
    if (vc && data) { const it = data.items.find(i => i.id === vc.dataset.v3dCheck); if (it && it.prep && it.prep.check_glb) open3d(it, vc.dataset.layerStart || true); }
  });

  // ---------------------------------------------------------------- 3Dビューア（glb/<Item>.glb、Draco圧縮）
  // 1本指で回転・ピンチでズーム・2本指で移動。光はカメラに付けて、どこから見ても形が読めるようにする
  let threeMods = null, v3d = null;
  const loadThree = () => threeMods || (threeMods = Promise.all([
    import("three"), import("three/addons/controls/OrbitControls.js"),
    import("three/addons/loaders/GLTFLoader.js"), import("three/addons/loaders/DRACOLoader.js"),
  ]).catch(e => { threeMods = null; throw e; }));

  // 四角の線（<Item>.glb.edges.bin、形式は工場の lib/export_glb.py に書いてある）→ LineSegments 用のジオメトリ
  async function loadEdges(THREE, path) {
    const blob = await (await fetch(await blobUrl(path))).blob();
    const ab = await new Response(blob.stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer();
    const dv = new DataView(ab);
    if (dv.getUint32(0) !== 0x45444731) throw new Error("edges: 形式が違う");   // "EDG1"
    const nv = dv.getUint32(4, true), ne = dv.getUint32(8, true);
    const lo = [0, 1, 2].map(i => dv.getFloat32(12 + i * 4, true)), span = [0, 1, 2].map(i => dv.getFloat32(24 + i * 4, true));
    const q = new Uint16Array(ab.slice(36, 36 + nv * 6));
    const d = nv < 65536 ? new Uint16Array(ab.slice(36 + nv * 6, 36 + nv * 6 + ne * 4)) : new Uint32Array(ab.slice(36 + nv * 6, 36 + nv * 6 + ne * 8));
    const pos = new Float32Array(nv * 3);
    for (let i = 0; i < pos.length; i++) pos[i] = lo[i % 3] + q[i] / 65535 * span[i % 3];
    const idx = new Uint32Array(ne * 2);
    for (let e = 0, a = 0; e < ne; e++) { a += d[e * 2]; idx[e * 2] = a; idx[e * 2 + 1] = a + d[e * 2 + 1]; }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    return g;
  }

  // 工程Cの3D確認（check.glb）の層。オブジェクト名の頭で分かれている（工程Cの prep_item.py が書き出す）
  const CHK_LAYERS = [["CHK_hidden", "消す面", "赤＝消す ／ オレンジ＝一部だけ隠れる（残す） ／ 半透明＝残す"],
    ["CHK_bevel", "丸める角", "オレンジ＝ハイポリで丸める角（見やすいよう太めに描いてある）"],
    ["CHK_low", "ローポリ", "ローポリ＝実際に使う形（消す面を消して、スムーズをかけた後。色＝テクスチャセット）"],
    ["CHK_high", "ハイポリ", "ハイポリ＝ベイク用（角の丸みと円柱の細かさを法線マップに焼く元。色＝テクスチャセット）"]];

  async function open3d(it, check, tex) {   // check＝工程Cの3D確認（消す面／丸める角／ローポリ／ハイポリ）。層の名前なら、その層で開く。tex＝テクスチャ込み
    if (v3d) close3d();
    const src = tex ? it.tex.glb : check ? it.prep.check_glb : it.glb;
    const start = typeof check === "string" && CHK_LAYERS.some(x => x[0] === check) ? check : CHK_LAYERS[0][0];
    const el = document.createElement("div");
    el.className = "v3d";
    el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-label", short(it) + " の3D");
    el.innerHTML = `<div class="v3d-head"><h3>${esc(short(it))}${check ? " ・ 工程Cの確認" : tex ? " ・ テクスチャ" : ""}</h3><button type="button" class="btn v3d-close">閉じる</button></div>
      ${check ? `<div class="v3d-layers" role="group" aria-label="見るもの">${CHK_LAYERS.map(([k, l]) => `<button type="button" class="btn" data-layer="${k}" aria-pressed="${k === start}">${l}</button>`).join("")}</div>` : ""}
      <div class="v3d-stage"><p class="v3d-msg">読み込み中…</p><p class="v3d-hint">${check ? esc(CHK_LAYERS.find(x => x[0] === start)[2]) : "1本指で回転・ピンチでズーム・2本指で移動"}</p></div>
      <div class="v3d-foot"><small></small>
        <button type="button" class="btn v3d-wire" aria-pressed="false">ワイヤー</button><button type="button" class="btn v3d-reset">視点を戻す</button></div>`;
    document.body.appendChild(el);
    document.body.style.overflow = "hidden";
    const st = { el, alive: true, raf: 0, cleanup: [] };
    v3d = st;
    history.pushState({ v3d: 1 }, "");   // スマホの「戻る」で閉じられるように
    el.querySelector(".v3d-close").addEventListener("click", () => history.state && history.state.v3d ? history.back() : close3d());
    const msg = el.querySelector(".v3d-msg"), stage = el.querySelector(".v3d-stage");
    try {
      const [[THREE, { OrbitControls }, { GLTFLoader }, { DRACOLoader }], url] = await Promise.all([loadThree(), blobUrl(src)]);
      const gltf = await new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/")).loadAsync(url);
      if (!st.alive) return;
      const css = getComputedStyle(document.documentElement);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
      stage.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(css.getPropertyValue("--bg").trim() || "#ecebe7");
      const model = gltf.scene;
      let tris = 0;
      model.traverse(o => {
        if (!o.isMesh) return;
        tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
        [].concat(o.material).forEach(m => {
          if (m.transparent) m.depthWrite = false;   // ガラスの後ろが消えないように
          m.polygonOffset = true; m.polygonOffsetFactor = 1; m.polygonOffsetUnits = 1;   // ワイヤーの線が面に埋もれないように
        });
      });
      scene.add(model);
      const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
      const maxd = Math.max(size.x, size.y, size.z) || 1;
      // 床のグリッド：1マス 25cm
      const gsize = Math.ceil(maxd * 1.5);
      const grid = new THREE.GridHelper(gsize, gsize * 4, css.getPropertyValue("--muted").trim() || "#888", css.getPropertyValue("--line").trim() || "#ccc");
      grid.position.set(center.x, box.min.y, center.z);
      scene.add(grid);
      const camera = new THREE.PerspectiveCamera(35, 1, maxd / 100, maxd * 100);
      scene.add(camera);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, tex ? 0.6 : 1.6));
      if (tex) {   // テクスチャ込みは、金属・つやが分かるよう部屋の映り込み（環境光）を足す
        try {
          const { RoomEnvironment } = await import("three/addons/environments/RoomEnvironment.js");
          const pm = new THREE.PMREMGenerator(renderer);
          scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
          pm.dispose();
        } catch (e) {}
      }
      const sun = new THREE.DirectionalLight(0xffffff, tex ? 1.4 : 2.2);
      sun.position.set(0.5, 1, 0.8);
      camera.add(sun);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      const fit = () => {
        const w = stage.clientWidth, h = stage.clientHeight;
        if (!w || !h) return;
        renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
      };
      const home = () => {   // 正面やや左上から、全体が収まる距離（縦長の画面では横の画角で決まる）
        const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
        const dist = size.length() / 2 / Math.sin(Math.min(vf, hf) / 2) * 0.85;
        camera.position.copy(center).add(new THREE.Vector3(-0.55, 0.45, 1).normalize().multiplyScalar(dist));
        controls.target.copy(center); controls.update();
      };
      fit();
      home();
      const ro = new ResizeObserver(fit); ro.observe(stage);
      const loop = () => { if (!st.alive) return; controls.update(); renderer.render(scene, camera); st.raf = requestAnimationFrame(loop); };
      loop();
      msg.hidden = true;
      el.querySelector(".v3d-foot small").textContent = `${Math.round(tris).toLocaleString()} tris${tex ? "（ローポリ）" : "（ベベル込み）"}`;
      el.querySelector(".v3d-reset").addEventListener("click", home);
      // ワイヤー：なし → 三角（GPUが描く三角形）→ 四角（Blender の辺）→ なし。線は面の上に重ねる。押したときに初めて作る
      const lineMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45 });
      // 工程Cの確認は層ごとに四角の線がある（prep.check_edges）。古いデータでなければ、なし ⇔ 三角 だけ
      const chkEdges = check ? (it.prep.check_edges || {}) : null;
      const hasQuad = !check || Object.keys(chkEdges).length > 0;
      const wires = {}, WIRE_NEXT = hasQuad ? { off: "tri", tri: "quad", quad: "off" } : { off: "tri", tri: "off" }, WIRE_TEXT = { off: "なし", tri: "三角", quad: "四角" };
      let wireMode = "off", curLayer = check ? start : null;
      const quadPath = () => check ? chkEdges[curLayer] : (tex ? it.tex.glb : it.glb) + ".edges.bin";
      const makeQuad = async () => {
        const p = quadPath();
        if (!p) return new THREE.Group();   // この層には線がない
        return new THREE.LineSegments(await loadEdges(THREE, p), lineMat);
      };
      const dropWire = k => { if (wires[k]) { scene.remove(wires[k]); wires[k].traverse(o => { if (o.geometry) o.geometry.dispose(); }); delete wires[k]; } };
      const shown = o => { for (let x = o; x; x = x.parent) if (!x.visible) return false; return true; };
      const makeTri = () => {   // 見えている物だけ
        const g = new THREE.Group();
        model.traverse(o => { if (o.isMesh && shown(o)) { const l = new THREE.LineSegments(new THREE.WireframeGeometry(o.geometry), lineMat); o.updateWorldMatrix(true, false); l.applyMatrix4(o.matrixWorld); g.add(l); } });
        return g;
      };
      if (check) {   // 層の切り替え：消す面 ／ 丸める角 ／ ローポリ ／ ハイポリ
        const hint = el.querySelector(".v3d-hint");
        const showLayer = k => {
          let n = 0;
          model.children.forEach(c => {
            c.visible = c.name.startsWith(k);
            if (c.visible) c.traverse(o => { if (o.isMesh) n += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
          });
          el.querySelectorAll("[data-layer]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.layer === k)));
          hint.textContent = (CHK_LAYERS.find(x => x[0] === k) || [])[2] || "";
          el.querySelector(".v3d-foot small").textContent = `${Math.round(n).toLocaleString()} tris`;
          curLayer = k;
          // 線は見えている層で作り直す
          dropWire("tri");
          dropWire("quad");
          if (wireMode === "tri") { wires.tri = makeTri(); scene.add(wires.tri); }
          if (wireMode === "quad") {
            makeQuad().then(w => { if (st.alive && curLayer === k && wireMode === "quad") { dropWire("quad"); wires.quad = w; scene.add(w); } })
              .catch(() => { el.querySelector(".v3d-foot small").textContent = "四角の線は読めませんでした"; });
          }
        };
        el.querySelectorAll("[data-layer]").forEach(b => b.addEventListener("click", () => showLayer(b.dataset.layer)));
        showLayer(start);
      }
      const wireBtn = el.querySelector(".v3d-wire");
      wireBtn.textContent = "ワイヤー：なし";
      wireBtn.addEventListener("click", async () => {
        const next = WIRE_NEXT[wireMode];
        wireBtn.disabled = true;
        try {
          if (next !== "off" && !wires[next]) wires[next] = next === "tri" ? makeTri() : await makeQuad();
          wireMode = next;
        } catch (e) {   // 四角が読めない（古いデータ・古い端末）ときは、なしに戻す
          wireMode = "off";
          el.querySelector(".v3d-foot small").textContent = "四角の線は読めませんでした";
        }
        if (!st.alive) return;
        Object.entries(wires).forEach(([k, w]) => { if (k === wireMode) scene.add(w); else scene.remove(w); });
        wireBtn.disabled = false;
        wireBtn.textContent = "ワイヤー：" + WIRE_TEXT[wireMode];
        wireBtn.setAttribute("aria-pressed", String(wireMode !== "off"));
      });
      st.cleanup.push(() => {
        ro.disconnect(); controls.dispose();
        model.traverse(o => { if (o.isMesh) { o.geometry.dispose(); [].concat(o.material).forEach(m => m.dispose()); } });
        Object.values(wires).forEach(w => w.traverse(o => { if (o.geometry) o.geometry.dispose(); }));
        lineMat.dispose();
        grid.geometry.dispose(); grid.material.dispose();
        renderer.dispose(); renderer.forceContextLoss();
      });
    } catch (e) {
      if (st.alive) msg.textContent = e instanceof ApiError ? errText(e) : "3Dを読めませんでした（通信を確かめて、もう一度開いてください）";
    }
  }

  function close3d() {
    if (!v3d) return;
    const st = v3d; v3d = null;
    st.alive = false; cancelAnimationFrame(st.raf);
    st.cleanup.forEach(f => { try { f(); } catch (e) {} });
    st.el.remove();
    document.body.style.overflow = "";
  }
  addEventListener("popstate", () => close3d());
  // 前後比較のスライダー
  document.addEventListener("input", e => {
    if (!e.target.classList.contains("cmp-range")) return;
    e.target.closest(".cmp-box").querySelector(".cmp").style.setProperty("--x", e.target.value + "%");
  });
  // 4面図（タップで3D）をキーボードでも開けるように
  document.addEventListener("keydown", e => {
    const s = e.target.closest && e.target.closest(".sheet[data-v3d], .sheet[data-v3d-check]");
    if (s && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); s.click(); }
  });
  addEventListener("keydown", e => { if (e.key === "Escape" && v3d) history.state && history.state.v3d ? history.back() : close3d(); });

  function renderAll() {
    document.getElementById("title").textContent = "3Dアセット工場";
    document.getElementById("when").textContent = data ? `テーマ ${data.theme} ・ 更新 ${fmt(data.updated)} ・ 次 ${fmt(data.next_run)}` : "";
    renderReview(); renderLine(); renderLog();
    if (!document.getElementById("view-help").hidden) renderHelp();
    if (!document.getElementById("view-stage").hidden) renderStage();
  }

  // アプリの版：更新したら APP_VERSION と version.txt を同じ値にして push する。
  // GitHub Pages はページを10分キャッシュするので、新しい版があれば上に帯を出し、押すと別のURL（?v=）で読み直して入れ替える
  const APP_VERSION = "2026-10-28.6";
  async function checkVersion() {
    try {
      const v = (await (await fetch(`version.txt?t=${Date.now()}`, { cache: "no-store" })).text()).trim();
      const bar = document.getElementById("update-bar");
      if (v && v !== APP_VERSION && /^[\w.-]+$/.test(v)) {
        bar.hidden = false;
        bar.onclick = () => location.replace(`./?v=${encodeURIComponent(v)}`);
      } else bar.hidden = true;
    } catch (e) {}
  }

  async function refresh() {
    checkVersion();
    const btn = document.getElementById("reload");
    btn.classList.add("spin"); btn.disabled = true;
    loadErr = null;
    try {
      const [d] = await Promise.all([api("data.json", { raw: true }).then(r => r.json()), loadInbox(), loadRequests()]);
      // 画像はファイル名が同じまま中身が変わるので、工場の状況が更新されたら覚えている画像を捨てて取り直す
      if (!data || d.updated !== data.updated) {
        imgCache.forEach(p => p.then(u => URL.revokeObjectURL(u)).catch(() => {}));
        imgCache.clear();
      }
      data = d;
      try { localStorage.setItem("last_data", JSON.stringify(d)); } catch (e) {}
    } catch (e) {
      loadErr = errText(e);
      if (!data) { try { data = JSON.parse(localStorage.getItem("last_data") || "null"); } catch (x) {} }
      if (data) loadErr = null;
      if (e.message === "no_token") switchTab("settings");
    } finally { btn.classList.remove("spin"); btn.disabled = false; }
    renderAll();
    startPoll();
  }

  // ---------------------------------------------------------------- タブ
  function switchTab(name) {
    document.querySelectorAll(".tab").forEach(t => { if (t.dataset.tab === name) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current"); });
    document.querySelectorAll("main").forEach(m => { m.hidden = m.dataset.view !== name; });
    if (name === "settings") renderSettings();
    if (name === "help") renderHelp();
    window.scrollTo(0, 0);
    try { sessionStorage.setItem("tab", name); } catch (e) {}
  }
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));
  document.getElementById("reload").addEventListener("click", refresh);

  let startTab = "review";
  try { startTab = sessionStorage.getItem("tab") || "review"; } catch (e) {}
  if (startTab === "stage") startTab = "line";   // 一覧ページは開き直したらラインに戻す
  switchTab(startTab);
  if (cfg().token) refresh(); else { loadErr = "設定タブで鍵（トークン）を入れてください"; renderAll(); switchTab("settings"); }
})();
</script>
</body>
</html>
